<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskora — Đồng hồ</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="t-push-pin" viewBox="0 0 256 256" fill="currentColor"><path d="M235.32,81.37,174.63,20.69a16,16,0,0,0-22.63,0L98.37,74.49c-10.66-3.34-35-7.37-60.4,13.14a16,16,0,0,0-1.29,23.78L85,159.71,42.34,202.34a8,8,0,0,0,11.32,11.32L96.29,171l48.29,48.29A16,16,0,0,0,155.9,224c.38,0,.75,0,1.13,0a15.93,15.93,0,0,0,11.64-6.33c19.64-26.1,17.75-47.32,13.19-60L235.33,104A16,16,0,0,0,235.32,81.37ZM224,92.69h0l-57.27,57.46a8,8,0,0,0-1.49,9.22c9.46,18.93-1.8,38.59-9.34,48.62L48,100.08c12.08-9.74,23.64-12.31,32.48-12.31A40.13,40.13,0,0,1,96.81,91a8,8,0,0,0,9.25-1.51L163.32,32,224,92.68Z"/></symbol>
    <symbol id="t-x" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></symbol>
    <symbol id="t-reset" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a96,96,0,0,1-94.71,96H128a95.38,95.38,0,0,1-65.07-26.27l-10.16,10.16a8,8,0,0,1-13.62-2.2L24,128.09a8,8,0,0,1,10.77-9.63L82,155.93a8,8,0,0,1-8.57,14L42.46,158.4A80,80,0,1,0,128,48a79.84,79.84,0,0,0-62.27,29.5,8,8,0,0,1-12.45-10A96,96,0,0,1,224,128Z"/></symbol>
    <symbol id="t-check" viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></symbol>
    <symbol id="t-clock" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></symbol>
  </svg>

  <main class="tcard" id="t-card">
    <!-- thanh tiêu đề tự vẽ — kéo để di chuyển cửa sổ -->
    <div class="tbar" data-tauri-drag-region>
      <span class="tmode" id="t-mode" data-tauri-drag-region>Tập trung</span>
      <div class="tactions">
        <button class="ticon" id="t-pin" type="button" title="Ghim — luôn nổi trên các cửa sổ" aria-pressed="true" aria-label="Ghim — luôn nổi"><svg class="tic"><use href="#t-push-pin"/></svg></button>
        <button class="ticon" id="t-close" type="button" title="Đóng đồng hồ (phiên vẫn chạy)" aria-label="Đóng đồng hồ"><svg class="tic"><use href="#t-x"/></svg></button>
      </div>
    </div>

    <!-- nhắc nghỉ mắt 20-20-20 — một lần mỗi phiên, đúng mốc 20:00 -->
    <div class="teye" id="t-eye" hidden><span>20-20-20 — nhìn xa ~6m · <b id="t-eye-count">20</b>s</span></div>

    <!-- trạng thái: có phiên đang chạy / vừa xong -->
    <section class="tmain" id="t-main" hidden>
      <div class="tring-wrap">
        <svg class="tring" viewBox="0 0 120 120" role="timer" aria-live="polite" aria-label="Đồng hồ đếm ngược">
          <circle class="ttrack" cx="60" cy="60" r="52"></circle>
          <circle class="tprog" id="t-prog" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ttime" id="t-time">25:00</div>
      </div>
      <div class="ttask" id="t-title"></div>
      <div class="tcontrols">
        <button class="tbtn ghost" id="t-pause" type="button">Tạm dừng</button>
        <button class="tbtn ghost" id="t-reset" type="button" title="Bắt đầu lại đồng hồ"><svg class="tic"><use href="#t-reset"/></svg>Bắt đầu lại</button>
        <button class="tbtn danger" id="t-stop" type="button">Dừng</button>
      </div>
    </section>

    <!-- trạng thái: vừa xong một phiên focus -->
    <section class="tdone" id="t-done" hidden>
      <div class="tdone-ic"><svg class="tic big"><use href="#t-check"/></svg></div>
      <p class="tdone-title" id="t-done-title">Xong một phiên! Bạn làm được.</p>
      <p class="tdone-sub" id="t-done-sub">Nghỉ một chút nhé</p>
      <div class="tdone-actions">
        <button class="tbtn ghost" id="t-done-stop" type="button">Dừng</button>
        <button class="tbtn primary" id="t-done-break" type="button">Nghỉ 5:00</button>
      </div>
    </section>

    <!-- trạng thái: chưa có phiên nào -->
    <section class="tempty" id="t-empty" hidden>
      <div class="tempty-ic">✦</div>
      <p class="tempty-title">Chưa có phiên nào đang chạy</p>
      <p class="tempty-sub">Bắt đầu từ nút “Tập trung” trong Taskora ✦</p>
      <button class="tbtn primary" id="t-open-main" type="button"><svg class="tic"><use href="#t-clock"/></svg>Mở Taskora</button>
    </section>
  </main>

  <script src="timer.js"></script>
</body>
</html>
