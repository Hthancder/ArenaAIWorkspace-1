name: Build dig3st (.deb)

on:
  push:
    branches:
      - arena/55c18ace-arenaaiworkspace-1
    paths:
      - '.github/workflows/build-dig3st.yml'
      - 'patches/**'
  workflow_dispatch:
    inputs:
      archs:
        description: 'Target architectures (e.g. "arm64 arm64e" or "arm64")'
        required: false
        default: 'arm64 arm64e'
        type: string

jobs:
  build:
    runs-on: macos-latest
    env:
      CI: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIG3ST_ARCHS: ${{ inputs.archs || 'arm64 arm64e' }}

    steps:
      - name: Checkout patch workspace
        uses: actions/checkout@v4

      - name: Checkout uncor3/dig3st (pinned upstream)
        uses: actions/checkout@v4
        with:
          repository: uncor3/dig3st
          ref: 28522b9e13837389d83aef14b07fc99e2742fb65
          path: dig3st

      - name: Apply source fixes patch
        working-directory: dig3st
        run: |
          git apply --check ../patches/dig3st-fixes.patch
          git apply ../patches/dig3st-fixes.patch
          git diff --stat

      - name: Install roothide/theos, Xcode toolchain, and iOS SDK
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install make ldid xz dpkg
          BREW_PREFIX="$(brew --prefix)"
          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:$PATH"
          THEOS_DIR="${RUNNER_TEMP}/theos"
          echo "THEOS=${THEOS_DIR}" >> "$GITHUB_ENV"
          export THEOS="${THEOS_DIR}"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS" 2>&1 | tee /tmp/install.log
          "$THEOS/bin/install-sdk" latest 2>&1 | tee -a /tmp/install.log
          ls -la "$THEOS/sdks"
          ls -la "$THEOS/vendor/lib/iphone/roothide"
          xcrun --sdk iphoneos clang --version
          make --version | head -n 2

      - name: Build rootful, rootless, and roothide .deb packages
        working-directory: dig3st
        run: |
          set -o pipefail
          rm -rf ./packages
          {
            echo "=== Building rootful (ARCHS=${DIG3ST_ARCHS}) ==="
            THEOS_PACKAGE_SCHEME= make package FINALPACKAGE=1 ARCHS="$DIG3ST_ARCHS"
            make clean
            echo "=== Building rootless (ARCHS=${DIG3ST_ARCHS}) ==="
            THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 ARCHS="$DIG3ST_ARCHS"
            make clean
            echo "=== Building roothide (ARCHS=${DIG3ST_ARCHS}) ==="
            THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1 ARCHS="$DIG3ST_ARCHS"
            make clean
          } 2>&1 | tee /tmp/build.log

      - name: Inspect built .deb packages and verify RootHide ABI/linkage
        working-directory: dig3st
        run: |
          {
            ls -lh ./packages/*.deb
            for f in ./packages/*.deb; do
              echo "========================================"
              echo "PACKAGE: $f"
              dpkg-deb -I "$f"
              dpkg-deb -c "$f"
            done
            echo "=== Verify RootHide Mach-O slices, ABI & linkage ==="
            rm -rf /tmp/rh-verify && mkdir -p /tmp/rh-verify
            dpkg-deb -x ./packages/*_iphoneos-arm64e.deb /tmp/rh-verify
            for bin in /tmp/rh-verify/Library/MobileSubstrate/DynamicLibraries/dig3st.dylib /tmp/rh-verify/Library/PreferenceBundles/dig3st.bundle/dig3st; do
              echo "--- $bin ---"
              lipo -info "$bin"
              otool -hv "$bin"
              otool -L "$bin"
            done
            python3 - <<'PY'
          import pathlib
          for bin_path in sorted(pathlib.Path("/tmp/rh-verify").rglob("dig3st*")):
              if bin_path.is_file() and bin_path.suffix in ("", ".dylib"):
                  data = bin_path.read_bytes()
                  has_roothide = b"libroothide.dylib" in data
                  has_jbroot_rpath = b"@loader_path/.jbroot" in data
                  has_var_jb = b"/var/jb" in data
                  print(f"{bin_path}: size={len(data)} libroothide={has_roothide} jbroot_loader={has_jbroot_rpath} var_jb={has_var_jb}")
                  assert has_roothide and has_jbroot_rpath and not has_var_jb, f"Unexpected linkage in {bin_path}"
          PY
            rm -rf /tmp/rh-verify
          } 2>&1 | tee /tmp/deb-inspect.log

      - name: Emit summary annotations
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re

          def emit(title, text):
              for idx in range(0, max(1, len(text)), 3000):
                  chunk = text[idx:idx+3000]
                  esc = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  suffix = f"-{(idx // 3000) + 1}" if len(text) > 3000 else ""
                  print(f"::notice title={title}{suffix}::{esc}")

          install_p = pathlib.Path("/tmp/install.log")
          if install_p.exists():
              emit("install", install_p.read_text(errors="replace")[-3000:])

          build_p = pathlib.Path("/tmp/build.log")
          if build_p.exists():
              btxt = build_p.read_text(errors="replace")
              emit("build", btxt[-3000:])
              interesting = "\n".join(
                  line for line in btxt.splitlines()
                  if re.search(r"(warning:|error:|dm\.pl|=== Building)", line, re.I)
              )
              if interesting:
                  emit("build-diag", interesting[-3000:])

          deb_p = pathlib.Path("/tmp/deb-inspect.log")
          if deb_p.exists():
              emit("deb", deb_p.read_text(errors="replace"))
          PY

      - name: Upload built .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dig3st-debs
          path: dig3st/packages/*.deb
