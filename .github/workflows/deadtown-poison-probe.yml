name: Dead Town poison reconstruction probe (no IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-poison-probe.yml
      - tools/prepare_deadtown_poison_probe.py
      - tools/check_deadtown_poison_probe.py
      - tools/deadtown-poison-probe.csx
      - tools/deadtown-vm-probe.csx
      - tools/deadtown_event_probe.py
      - tools/deadtown_poison_evidence.py
      - tools/deadtown_native_tables.py
      - tests/test_prepare_deadtown_poison_probe.py
      - tests/test_check_deadtown_poison_probe.py

permissions:
  contents: read

jobs:
  candidate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned source and original APK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install capstone==5.0.6 pyelftools==0.32
          mkdir -p work/source work/utmt
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > work/original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  work/original.apk' | sha256sum -c
          unzip -p work/original.apk assets/game.droid > work/game.droid
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C work/source --strip-components=1
          python tools/recover_deadtown_audio.py extract work/original.apk work/audio
          python tools/stage_deadtown_gmx.py work/source/deadtown.gmx work/staged || test "$?" -eq 1
          python tools/recover_deadtown_audio.py apply work/staged work/audio
          python tools/prepare_deadtown_offline.py work/staged work/offline
      - name: Regression tests and candidate-only copy
        shell: bash
        env:
          DEADTOWN_TEST_OFFLINE: ${{ github.workspace }}/work/offline
          DEADTOWN_TEST_APK: ${{ github.workspace }}/work/original.apk
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_prepare_deadtown_poison_probe.py' -v
          python -m unittest discover -s tests -p 'test_check_deadtown_poison_probe.py' -v
          python tools/prepare_deadtown_poison_probe.py work/offline work/original.apk work/candidate
          python tools/deadtown_event_probe.py work/candidate work/events.json
      - name: Download pinned UndertaleModTool CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 0.9.2.0 -R UnderminersTeam/UndertaleModTool -p 'UTMT_CLI_v0.9.2.0-Ubuntu.zip' -O work/utmt.zip
          echo 'd182f00c0e5ced8d9252aa1f796374cfee077a3889a658e70b68685f9cd559c7  work/utmt.zip' | sha256sum -c
          unzip -q work/utmt.zip -d work/utmt
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          chmod +x "$exe"
          echo "UTMT_EXE=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
      - name: Compile and instrument the disposable VM data
        shell: bash
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/work/candidate/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events.json
        run: |
          set -euo pipefail
          mkdir -p work/diagnostic work/save
          "$UTMT_EXE" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/candidate.win > work/compile.log 2>&1 || { tail -100 work/compile.log; exit 1; }
          "$UTMT_EXE" load work/candidate.win -s tools/deadtown-poison-probe.csx -o work/diagnostic/data.win > work/instrument.log 2>&1 || { tail -100 work/instrument.log; exit 1; }
          unzip -p work/original.apk assets/audiogroup1.dat > work/diagnostic/audiogroup1.dat
          unzip -p work/original.apk assets/audiogroup2.dat > work/diagnostic/audiogroup2.dat
          grep -F 'POISON_INSTRUMENT:' work/instrument.log
          grep -F 'POISON_INSTRUMENT: disposable desktop VM only' work/instrument.log >/dev/null
          test -s work/diagnostic/data.win
      - name: Restore runner build cache
        id: runner-cache
        uses: actions/cache/restore@v4
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Prepare pinned runner
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.runner-cache.outputs.cache-hit }}' = 'true' ] && test -x work/runner-build/gmrunner; then
            if ldd work/runner-build/gmrunner | grep -q 'not found'; then
              timeout 120 sudo apt-get install -y -qq libsdl2-2.0-0 libbz2-1.0
            fi
            ldd work/runner-build/gmrunner | grep 'not found' && exit 1 || true
          else
            timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
            timeout 120 sudo apt-get install -y -qq libsdl2-dev libbz2-dev pkg-config
            mkdir -p work/runner
            curl -fsSL --retry 2 'https://codeload.github.com/andronep/gmrunner/tar.gz/e7121381d38b03a24242812fc22b0a7386d545c6' | tar xz -C work/runner --strip-components=1
            cmake -S work/runner -B work/runner-build -DCMAKE_BUILD_TYPE=Release
            cmake --build work/runner-build --target gmdump gmrunner --parallel 4
          fi
      - name: Exercise forced poison candidate on disposable save data
        shell: bash
        run: |
          set -euo pipefail
          GMR_TRACE_CALL=ds_map_add,ds_map_delete,ds_map_find_value,ds_map_exists,instance_create \
            timeout 120 work/runner-build/gmrunner work/diagnostic --headless --fast --mute --seed 1 \
            --frames 190 --trace --stats --goto rom_play@160 --save-dir work/save > work/probe.log 2>&1 || { tail -100 work/probe.log; exit 1; }
          grep -F '[room] -> rom_play' work/probe.log
          grep -F 'DT_POISON|' work/probe.log || true
          python tools/check_deadtown_poison_probe.py work/probe.log work/save/dt_poison_probe.sav
      - name: Summarize probe diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('probe.log', 'instrument.log', 'compile.log'):
              path = Path('work') / name
              if not path.exists():
                  print('::notice::' + name + ': not created')
                  continue
              lines = path.read_text(errors='replace').splitlines()
              selected = [line for line in lines if 'DT_POISON|' in line or 'PROBE:' in line or
                          'POISON_INSTRUMENT' in line or 'error' in line.lower() or 'exception' in line.lower() or
                          ('[call]' in line and ('gml_Script_item_use' in line or 'probe_obj_player_200' in line))]
              for label, group in (('markers', selected[-20:]), ('tail', lines[-12:])):
                  text = ' | '.join(group).replace('%', '%25').replace('\r', ' ')
                  print('::notice::' + name + ' ' + label + ': ' + text[:3500])
          PY
      - name: Preserve research logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-poison-probe-logs
          path: |
            work/compile.log
            work/instrument.log
            work/probe.log
          if-no-files-found: ignore
          retention-days: 3
