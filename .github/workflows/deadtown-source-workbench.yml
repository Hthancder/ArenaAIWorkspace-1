name: Dead Town editable source workbench (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - '.github/workflows/deadtown-source-workbench.yml'
      - 'deadtown-source/**'
      - 'tools/materialize_deadtown_source.py'
      - 'tests/test_materialize_deadtown_source.py'
      - 'tools/stage_deadtown_gmx.py'
      - 'tools/prepare_deadtown_offline.py'
      - 'tools/recover_deadtown_audio.py'
      - 'tools/deadtown_native_inventory.py'
      - 'tools/deadtown_sprite_metadata.py'
      - 'tools/deadtown_sprite_pixels.py'
      - 'tools/recover_deadtown_sprites.py'
      - 'tools/check_deadtown_restored_frames.py'
      - 'tests/test_check_deadtown_restored_frames.py'
      - 'tools/check_deadtown_bbox_candidates.py'
      - 'tests/test_check_deadtown_bbox_candidates.py'
      - 'tools/deadtown_sprite_order_evidence.py'
      - 'tests/test_deadtown_sprite_order_evidence.py'
      - 'tools/deadtown_room_evidence.py'
      - 'tests/test_deadtown_room_evidence.py'
      - 'tools/deadtown_object_evidence.py'
      - 'tests/test_deadtown_object_evidence.py'
      - 'tools/deadtown_empty_collision_evidence.py'
      - 'tests/test_deadtown_empty_collision_evidence.py'
      - 'tools/deadtown_event_probe.py'
      - 'tools/deadtown_rect_sprite_candidates.py'
      - 'tests/test_deadtown_rect_sprite_candidates.py'
      - 'tools/check_deadtown_empty_mask.py'
      - 'tests/test_check_deadtown_empty_mask.py'
      - 'tools/deadtown_unresolved_sprites.py'
      - 'tests/test_deadtown_unresolved_sprites.py'
      - 'tools/deadtown_unresolved_rooms.py'
      - 'tests/test_deadtown_unresolved_rooms.py'
      - 'tests/test_deadtown_eating_sound.py'
      - 'tools/deadtown_sprite_masks.py'
      - 'tools/audit_deadtown_gmx.py'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image analysis dependency
        run: python -m pip install Pillow==11.3.0
      - name: Retrieve and verify pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/gmx
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C .cache/gmx --strip-components=1
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > .cache/deadtown-original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  .cache/deadtown-original.apk' | sha256sum -c
      - name: Test and materialize the incomplete editable workspace
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_materialize_deadtown_source.py' -v
          python -m unittest discover -s tests -p 'test_check_deadtown_restored_frames.py' -v
          python -m unittest discover -s tests -p 'test_check_deadtown_bbox_candidates.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_sprite_order_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_room_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_object_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_empty_collision_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_rect_sprite_candidates.py' -v
          python -m unittest discover -s tests -p 'test_check_deadtown_empty_mask.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_unresolved_sprites.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_unresolved_rooms.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_eating_sound.py' -v
          python tools/materialize_deadtown_source.py .cache/gmx/deadtown.gmx .cache/deadtown-original.apk .cache/result
          python tools/check_deadtown_restored_frames.py .cache/deadtown-original.apk deadtown-source --output .cache/result/restored-frames.json
          python tools/check_deadtown_bbox_candidates.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/bbox-candidates.json
          python tools/deadtown_rect_sprite_candidates.py verify .cache/deadtown-original.apk deadtown-source --output .cache/result/rect-candidates.json
          python tools/check_deadtown_empty_mask.py .cache/deadtown-original.apk deadtown-source --output .cache/result/empty-mask.json
          python tools/deadtown_unresolved_sprites.py verify .cache/deadtown-original.apk deadtown-source/unresolved/sprites
          python tools/deadtown_unresolved_rooms.py verify .cache/deadtown-original.apk deadtown-source/unresolved/rooms
          python tools/deadtown_sprite_pixels.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/sprite-pixels.json
          python tools/deadtown_sprite_order_evidence.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/sprite-order.json
          python tools/deadtown_room_evidence.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/room-evidence.json
          python tools/deadtown_object_evidence.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/object-evidence.json
          python tools/deadtown_empty_collision_evidence.py .cache/deadtown-original.apk .cache/result/project --output .cache/result/empty-collision-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('.cache/result/status.json').read_text())
          assert status['state'] == 'INCOMPLETE_NOT_FOR_RELEASE'
          assert not status['missing_referenced_files']
          frames = json.loads(Path('.cache/result/restored-frames.json').read_text())
          pixels = json.loads(Path('.cache/result/sprite-pixels.json').read_text())
          order = json.loads(Path('.cache/result/sprite-order.json').read_text())
          assert len(order['missing_from_gmx']) == status['native_sprites_missing_by_name']
          for name, detail in frames['sprites'].items():
              for frame in detail['restored']:
                  assert pixels['sprites'][name]['frames'][frame['index']] == 'exact_rgba'
          candidates = json.loads(Path('deadtown-source/rect-sprite-candidates.json').read_text())['names']
          for name in candidates:
              assert pixels['sprites'][name]['frames'] and all(x == 'exact_rgba' for x in pixels['sprites'][name]['frames'])
          assert pixels['sprites']['mask_noone']['frames'] == ['scaled_not_compared']
          print('::notice::INCOMPLETE workspace: ' + json.dumps(status, separators=(',', ':'))[:3500])
          rect = json.loads(Path('.cache/result/rect-candidates.json').read_text())
          print('::notice::Restored candidates: ' + str(frames['sprite_count'] + rect['sprite_count'] + 1) + ' sprites, ' + str(frames['frame_count'] + rect['frame_count'] + 1) + ' frames; static only; includes special scaled transparent case')
          print('::notice::XML common sprite rank differences: ' + str(order['different_common_rank']) + '; not compiled IDs')
          rooms = json.loads(Path('.cache/result/room-evidence.json').read_text())
          print('::notice::Room comparison: ' + str(len(rooms['shared'])) + ' shared, ' + str(len(rooms['apk_only'])) + ' absent; static fields/placements only')
          objects = json.loads(Path('.cache/result/object-evidence.json').read_text())
          print('::notice::Object comparison: ' + str(objects['common_count']) + ' shared, ' + str(objects['differing_defaults_count']) + ' with differing selected defaults; not behavior proof')
          PY
      - name: Preserve comparison reports, not packaged game assets
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-source-comparison
          path: |
            .cache/result/status.json
            .cache/result/comparison.json
            .cache/result/sprite-metadata.json
            .cache/result/restored-frames.json
            .cache/result/bbox-candidates.json
            .cache/result/rect-candidates.json
            .cache/result/empty-mask.json
            .cache/result/sprite-pixels.json
            .cache/result/sprite-order.json
            .cache/result/room-evidence.json
            .cache/result/object-evidence.json
            .cache/result/empty-collision-evidence.json
          if-no-files-found: error
          retention-days: 3
