name: Build WriteNow (RootHide)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/*'
    paths:
      - 'WriteNow/**'
      - '.github/workflows/build-writenow.yml'

env:
  VERSION: 1.0
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Setup Xcode
      run: |
        ls -d /Applications/Xcode*.app
        if [ -d "/Applications/Xcode_15.4.app" ]; then
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        fi
        xcodebuild -version

    - name: Setup Environment
      run: |
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Setup Theos SDK
      run: |
        curl -fsSL https://raw.githubusercontent.com/OwnGoalStudio/theos/refs/heads/master/bin/install-theos -o "$RUNNER_TEMP/install-theos"
        sed -i '' '/^[[:space:]]*brew update || true$/d' "$RUNNER_TEMP/install-theos"
        bash "$RUNNER_TEMP/install-theos"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Environment (RootHide)
      run: |
        echo "$HOME/theos-roothide-legacy/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos-roothide-legacy" >> $GITHUB_ENV

    - name: Setup Theos (RootHide)
      run: |
        git clone --branch legacy-roothide --depth 1 --recurse-submodules https://github.com/owngoal-dev/theos-roothide.git "$THEOS"
        cp -R "$HOME/theos/sdks/." "$THEOS/sdks/"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch swift-create-xcframework
      uses: robinraju/release-downloader@v1.11
      with:
        repository: Lessica/swift-create-xcframework
        tag: v5.9
        fileName: swift-create-xcframework@5.9.zip

    - name: Install swift-create-xcframework
      run: |
        SWIFT_CREATE_XCFRAMEWORK_PATH=$(pwd)/swift-create-xcframework@5.9.zip
        pushd $HOME/theos-roothide-legacy/bin
        unzip $SWIFT_CREATE_XCFRAMEWORK_PATH
        popd

    - name: Install ldid-procursus and xcbeautify
      run: |
        brew uninstall ldid || true
        brew install ldid-procursus
        command -v xcbeautify >/dev/null || brew install xcbeautify

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build RootHide (arm64e)
      working-directory: WriteNow
      run: |
        source devkit/roothide.sh
        set +e
        set -o pipefail
        make clean package 2>&1 | tee /tmp/build.log
        STATUS=$?
        set -e
        if [ "$STATUS" -ne 0 ]; then
          tail -n 50 /tmp/build.log | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error::$line"
            fi
          done
          exit "$STATUS"
        fi

    - name: Read Version
      working-directory: WriteNow
      run: |
        VERSION=$(grep '^Version:' .theos/_/DEBIAN/control | awk '{print $2}')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        ls -lh ./packages/

    - name: Upload Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ env.VERSION }}
        path: |
          ./WriteNow/packages/*.deb
