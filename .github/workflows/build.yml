name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: .deb (${{ matrix.scheme }}, arm64, iOS 15)
    # Toolchain chính thức của Apple: clang + ld64 + ldid + dpkg-deb THẬT.
    # Không dùng zig trên Linux nữa — xem docs/09-ly-do-chuyen-sang-macos.md
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos_repo: https://github.com/theos/theos.git
            package_arch: iphoneos-arm64
          - scheme: roothide
            theos_repo: https://github.com/roothide/theos.git
            package_arch: iphoneos-arm64e
    env:
      SCHEME: ${{ matrix.scheme }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Theos + ldid
        run: |
          set -euo pipefail
          brew install ldid dpkg xz rsync
          git clone --recursive --depth 1 "${{ matrix.theos_repo }}" "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "PATH=$RUNNER_TEMP/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Lấy iOS SDK 15.6
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS15.6.sdk
          ln -sfn "$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" "$RUNNER_TEMP/theos/sdks/iPhoneOS15.6.sdk"
          ls -l "$RUNNER_TEMP/theos/sdks"

      - name: Build (${{ matrix.scheme }})
        run: |
          set -euo pipefail
          # `make package` KHÔNG ký binary. Phải dùng FINALPACKAGE=1 để Theos
          # chạy `ldid -S` trên từng file — thiếu chữ ký là process chết lúc load.
          ./build.sh SCHEME=${SCHEME}

      - name: Kiểm tra sản phẩm
        run: |
          set -euo pipefail
          DEB="$(ls packages/*.deb | head -n1)"
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "--- cấu trúc gói ---"
          dpkg-deb -c "$DEB"
          python3 tools/verify_deb.py "$DEB" "${PACKAGE_ARCH}" --strict
          echo "SIZE=$(stat -f%z "$DEB")" >> "$GITHUB_ENV"

      - name: SHA256 + job summary
        run: |
          set -euo pipefail
          BASE="$(basename "$DEB")"
          ( cd packages && shasum -a 256 "$BASE" > "SHA256SUMS-${SCHEME}" )
          cat "packages/SHA256SUMS-${SCHEME}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "| scheme | package arch | dung lượng |"
            echo "| --- | --- | --- |"
            echo "| ${SCHEME} | ${PACKAGE_ARCH} | $(du -h "$DEB" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiriBridge-${{ matrix.scheme }}-deb-${{ github.sha }}
          path: |
            packages/*.deb
            packages/SHA256SUMS-${{ matrix.scheme }}
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}"
          name: "${{ github.ref_type == 'tag' && github.ref_name || format('CI build {0}', github.run_number) }}"
          body: |
            SiriBridge cho iOS 15 (arm64) — hai bản **rootless** và **roothide**. Không có bản rootful.

            | File | Dùng cho |
            | --- | --- |
            | `*_iphoneos-arm64.deb` | jailbreak rootless (Dopamine / palera1n 15, `/var/jb`) |
            | `*_iphoneos-arm64e.deb` | roothide Bootstrap (package arch arm64e, code vẫn là arm64) |

            Build bằng **macOS runner + Theos chính thức** (clang, ld64, ldid), không còn zig.
          files: |
            packages/*.deb
            packages/SHA256SUMS-${{ matrix.scheme }}
          fail_on_unmatched_files: true
          generate_release_notes: false
