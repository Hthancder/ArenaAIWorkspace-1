name: Build SiriX

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # Một job macOS DUY NHẤT làm tất cả: test + build cả rootless và roothide.
  # Trước đây là matrix 2 job (+1 job test) nên cần 3 runner macOS; runner macOS
  # của GitHub thường xếp hàng > 15 phút và bị huỷ, làm mất bản build roothide.
  build:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression tests (lint + C/ObjC)
        run: |
          set -uo pipefail
          # Chạy từng script, gom log; khi hỏng thì đẩy phần đuôi log vào
          # annotation của check-run để đọc được từ ngoài (job log bị chặn).
          log=$(mktemp)
          failed=""
          for script in check-prefs test-log-file test-intercept-macos test-sxllm-macos test-store-macos test-toolkit-macos test-headers-macos test-update-macos; do
            echo "===== $script =====" | tee -a "$log"
            if ! "./scripts/${script}.sh" >> "$log" 2>&1; then
              failed="$script"
              break
            fi
          done
          tail -n 80 "$log"
          if [ -n "$failed" ]; then
            msg=$(tail -n 30 "$log" | tr '\n' '\001' | sed 's/\001/%0A/g')
            echo "::error title=Regression tests: $failed failed::$msg"
            exit 1
          fi

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Build packages (rootless + roothide)
        run: |
          set -uo pipefail
          mkdir -p dist

          # SDK dùng chung cho cả hai bản theos (clone một lần cho nhanh).
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks "$GITHUB_WORKSPACE/sdks"
          git -C "$GITHUB_WORKSPACE/sdks" sparse-checkout set iPhoneOS15.6.sdk

          build_scheme() {
            local scheme="$1" repo="$2"
            local log="build-${scheme}.log"
            echo "===== $scheme ($repo) ====="
            rm -rf "$GITHUB_WORKSPACE/theos" "$GITHUB_WORKSPACE/packages"
            git clone --depth 1 --recursive "https://github.com/${repo}" "$GITHUB_WORKSPACE/theos" || return 1
            rm -rf "$GITHUB_WORKSPACE/theos/sdks"
            cp -R "$GITHUB_WORKSPACE/sdks" "$GITHUB_WORKSPACE/theos/sdks" || return 1
            export THEOS="$GITHUB_WORKSPACE/theos"

            make clean > "$log" 2>&1
            if ! make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$scheme" >> "$log" 2>&1; then
              echo "===== TAIL $log ====="
              tail -n 80 "$log"
              local msg
              msg=$(tail -n 40 "$log" | tr '\n' '\001' | sed 's/\001/%0A/g')
              echo "::error title=Build $scheme failed::$msg"
              return 1
            fi

            local deb
            deb=$(ls packages/*.deb 2>/dev/null | head -n 1)
            if [ -z "$deb" ]; then
              echo "::error title=Thiếu .deb ($scheme)::packages/ rỗng sau khi build"
              return 1
            fi
            mv "$deb" "dist/SiriX-${scheme}.deb"
            rm -rf "$GITHUB_WORKSPACE/packages"
            echo "✅ $scheme: $(basename "$deb") ($(wc -c < "dist/SiriX-${scheme}.deb") bytes)"
          }

          rc=0
          build_scheme rootless theos/theos || rc=1
          build_scheme roothide roothide/theos || rc=1
          ls -lh dist || true
          exit $rc

      - name: Validate packages
        run: |
          set -uo pipefail
          vfail() { echo "::error title=Validate ($2): $1::$3"; exit 1; }
          [ -n "$(ls dist/*.deb 2>/dev/null)" ] || vfail "no deb" "-" "Không có .deb nào trong dist/"
          for DEB in dist/*.deb; do
            SCHEME=$(basename "$DEB" .deb | sed 's/^SiriX-//')
            echo "===== $DEB ($SCHEME) ====="
            INFO=$(dpkg-deb --info "$DEB" 2>&1) || vfail "dpkg-deb --info" "$SCHEME" "$INFO"
            echo "$INFO"
            ARCH=$(dpkg-deb -f "$DEB" Architecture 2>&1) || vfail "dpkg-deb -f Architecture" "$SCHEME" "$ARCH"
            echo "Architecture: $ARCH"
            case "$ARCH" in
              iphoneos-arm64|iphoneos-arm64e) ;;
              *) vfail "arch" "$SCHEME" "Architecture không hợp lệ: $ARCH" ;;
            esac

            STAGE=$(mktemp -d)
            EX=$(dpkg-deb -x "$DEB" "$STAGE" 2>&1) || vfail "dpkg-deb -x" "$SCHEME" "$EX"

            DYLIB=$(find "$STAGE" -name 'SiriX.dylib' | head -n 1)
            [ -n "$DYLIB" ] || vfail "dylib" "$SCHEME" "Không thấy SiriX.dylib: $(find "$STAGE" -type f | head -30 | tr '\n' ' ')"
            # Ghi strings ra file rồi mới grep: `strings | grep -q` làm strings chết vì
            # SIGPIPE, pipefail biến nó thành exit 141 → báo thiếu marker dù có.
            strings "$DYLIB" > "$STAGE/strings.txt"
            for marker in _handleCommand addItemForSpeechRecognizedCommand SiriX; do
              grep -q -- "$marker" "$STAGE/strings.txt" ||
                vfail "marker:$marker" "$SCHEME" "không thấy '$marker' trong dylib ($(wc -l < "$STAGE/strings.txt") dòng strings)"
            done

            FILTER=$(find "$STAGE" -name 'SiriX.plist' ! -path '*PreferenceLoader*' | head -n 1)
            [ -n "$FILTER" ] || vfail "filter" "$SCHEME" "Không thấy filter SiriX.plist"
            grep -q 'com.apple.springboard' "$FILTER" || vfail "filter-content" "$SCHEME" "Filter thiếu com.apple.springboard"

            ROOTPLIST=$(find "$STAGE" -path '*SiriXPreferences.bundle/Root.plist' | head -n 1)
            [ -n "$ROOTPLIST" ] || vfail "prefs" "$SCHEME" "Không thấy SiriXPreferences.bundle/Root.plist"
            grep -rq 'SXPromptController' "$ROOTPLIST" || vfail "prefs-content" "$SCHEME" "Root.plist thiếu SXPromptController"

            ENTRY=$(find "$STAGE" -path '*PreferenceLoader*' -name 'SiriX.plist' | head -n 1)
            [ -n "$ENTRY" ] || vfail "entry" "$SCHEME" "Không thấy entry PreferenceLoader"
            grep -q 'SXRootListController' "$ENTRY" || vfail "entry-content" "$SCHEME" "Entry thiếu SXRootListController"

            echo "=== OK: $DEB ==="
            echo "✅ $SCHEME: $(basename "$DEB") — Architecture=$ARCH" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$STAGE"
          done

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: SiriX-debs
          path: dist/*.deb
          if-no-files-found: error

      - name: Ghi chú lỗi lên check-run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BODY=""
          for f in build-*.log; do
            [ -f "$f" ] || continue
            BODY+=$'\n### '"$f"$'\n```\n'"$(tail -n 60 "$f")"$'\n```\n'
          done
          CRID=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=50" \
                 --jq '[.check_runs[] | select(.name == "Build & test")][0].id' 2>/dev/null)
          if [ -n "$CRID" ] && [ "$CRID" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CRID}" \
              -f "output[title]=Build failed" \
              -f "output[summary]=${BODY}" >/dev/null 2>&1 || true
          fi

  publish:
    name: Publish deb to release
    needs: build
    # Chạy khi bấm tay, hoặc khi commit có thẻ [release] (push thường không tạo release).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (để đọc phiên bản trong control)
        uses: actions/checkout@v4

      - name: Download built debs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Chuẩn bị thư mục phát hành
        run: |
          set -euo pipefail
          VERSION=$(awk '/^Version:/ {print $2}' control)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          found=0
          for deb in artifacts/*/*.deb; do
            [ -f "$deb" ] || continue
            cp "$deb" "dist/$(basename "$deb")"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "::error title=Thiếu deb::Không có .deb trong artifacts/"; exit 1; }
          cd dist
          for f in *.deb; do sha256sum "$f" >> SHA256SUMS; done
          ls -lh
          printf '%s\n' \
            "Bản build tự động từ commit ${GITHUB_SHA:0:7} (nhánh ${GITHUB_REF_NAME})." \
            "" \
            "- SiriX-rootless.deb — Dopamine / palera1n rootless" \
            "- SiriX-roothide.deb — roothide" \
            "- SHA256SUMS — kiểm tra toàn vẹn trước khi cài" \
            "" \
            "Cài đặt: mở tệp .deb bằng Sileo/Zebra, hoặc chạy dpkg -i <tên>.deb rồi respring." \
            > /tmp/notes.md
          cat /tmp/notes.md

      - name: Tạo release kèm asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="sirix-${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS \
            --title "SiriX ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY"
          {
            echo "### 📦 $TAG"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
