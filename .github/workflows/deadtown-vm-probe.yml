name: Dead Town bytecode feasibility probe

on:
  workflow_dispatch:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-vm-probe.yml
      - tools/deadtown-vm-probe.csx
      - tools/deadtown_event_probe.py
      - tools/prepare_deadtown_offline.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original container and source script
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Preparation failed at line $LINENO (status $?)"' ERR
          mkdir -p work/source work/utmt
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > work/original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  work/original.apk' | sha256sum -c
          unzip -p work/original.apk assets/game.droid > work/game.droid
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C work/source --strip-components=1
          python3 tools/recover_deadtown_audio.py extract work/original.apk work/audio
          python3 tools/stage_deadtown_gmx.py work/source/deadtown.gmx work/staged || test "$?" -eq 1
          python3 tools/recover_deadtown_audio.py apply work/staged work/audio
          python3 tools/prepare_deadtown_offline.py work/staged work/offline
          python3 tools/deadtown_event_probe.py work/offline work/events.json
      - name: Download pinned UndertaleModTool CLI
        shell: bash
        run: |
          set -euo pipefail
          gh release download 0.9.2.0 -R UnderminersTeam/UndertaleModTool -p 'UTMT_CLI_v0.9.2.0-Ubuntu.zip' -O work/utmt.zip
          echo 'd182f00c0e5ced8d9252aa1f796374cfee077a3889a658e70b68685f9cd559c7  work/utmt.zip' | sha256sum -c
          unzip -q work/utmt.zip -d work/utmt
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          chmod +x "$exe"
          echo "UTMT_EXE=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Probe source scripts, without creating an IPA
        shell: bash
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/work/offline/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events.json
        run: |
          set +e
          "$UTMT_EXE" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/incomplete-probe.win 2>&1 | tee work/probe.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            "$UTMT_EXE" info work/incomplete-probe.win 2>&1 | tee -a work/probe.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then echo 'PROBE: serialized incomplete data was re-read by UndertaleModTool' | tee -a work/probe.log; fi
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('work/probe.log').read_text(errors='replace').splitlines()
          matches = [line for line in lines if 'PROBE:' in line or 'error' in line.lower() or 'exception' in line.lower()]
          for line in matches[:20]:
              print('::notice::' + line.replace('%', '%25')[:1000])
          PY
          exit "$status"
      - name: Restore runner build cache
        id: runner-cache
        uses: actions/cache/restore@v4
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Build runner data inspection tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libbz2-dev pkg-config
          mkdir -p work/runner
          curl -fsSL --retry 2 'https://codeload.github.com/andronep/gmrunner/tar.gz/e7121381d38b03a24242812fc22b0a7386d545c6' | tar xz -C work/runner --strip-components=1
          cmake -S work/runner -B work/runner-build -DCMAKE_BUILD_TYPE=Release
          cmake --build work/runner-build --target gmdump gmrunner --parallel 4
      - name: Cache runner build
        if: steps.runner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Inspect incomplete data using runner loader
        shell: bash
        run: |
          set +e
          work/runner-build/gmdump work/incomplete-probe.win info > work/runner-inspect.log 2>&1
          info_status=$?
          work/runner-build/gmdump work/incomplete-probe.win verify >> work/runner-inspect.log 2>&1
          verify_status=$?
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('work/runner-inspect.log').read_text(errors='replace').splitlines()[:30]:
              print('::notice::RUNNER_INSPECT: ' + line.replace('%', '%25')[:800])
          PY
          echo "::notice::Runner inspection statuses info=$info_status verify=$verify_status"
          [ "$info_status" -eq 0 ] && [ "$verify_status" -eq 0 ]
      - name: Attempt headless boot of incomplete data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/probe-game work/probe-save
          cp work/incomplete-probe.win work/probe-game/data.win
          unzip -p work/original.apk assets/audiogroup1.dat > work/probe-game/audiogroup1.dat
          unzip -p work/original.apk assets/audiogroup2.dat > work/probe-game/audiogroup2.dat
          set +e
          GMR_TRACE_CALL=game_end,room_goto,room_goto_next timeout 60 work/runner-build/gmrunner work/probe-game --headless --fast --mute --seed 1 --frames 300 --trace --stats --save-dir work/probe-save > work/boot.log 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('work/boot.log').read_text(errors='replace').splitlines()
          print(f'::notice::HEADLESS_BOOT: {len(lines)} log lines; this is incomplete test data, not a game release')
          key = [line for line in lines if any(word in line for word in ('[room]', '[stats]', '[gml]', '[trace]', '[audio]'))]
          print('::notice::HEADLESS_BOOT_SUMMARY: ' + ' | '.join(key).replace('%', '%25')[:3500])
          PY
          echo "::notice::HEADLESS_BOOT: exit status $status"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! grep -Fq '[room] -> rom_lobby' work/boot.log; then
            echo '::error::Headless run did not reach rom_lobby; it may have ended early.'
            exit 1
          fi
      - name: Probe gameplay room headlessly (forced transition)
        shell: bash
        run: |
          set +e
          mkdir -p work/play-save
          timeout 60 work/runner-build/gmrunner work/probe-game --headless --fast --mute --seed 1 --frames 400 --trace --stats --goto rom_play@160 --save-dir work/play-save > work/play.log 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('work/play.log').read_text(errors='replace').splitlines()
          key = [line for line in lines if any(word in line for word in ('[room]', '[stats]', '[gml]', '[trace]', 'error', 'Error'))]
          print('::notice::FORCED_GAMEPLAY_SUMMARY: ' + ' | '.join(key).replace('%', '%25')[:3500])
          PY
          if [ "$status" -ne 0 ]; then echo "::error::Forced gameplay probe exited $status"; exit "$status"; fi
          if ! grep -Fq '[room] -> rom_play' work/play.log; then
            echo '::error::Forced gameplay probe did not enter rom_play.'
            exit 1
          fi
      - name: Save incomplete game data for experimental IPA
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-incomplete-game-data
          path: work/probe-game/
          if-no-files-found: error
          retention-days: 3
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-vm-probe-log
          path: |
            work/probe.log
            work/runner-inspect.log
            work/boot.log
            work/play.log
          if-no-files-found: ignore
          retention-days: 3
