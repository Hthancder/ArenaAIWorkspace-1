name: Dead Town UI coordinate research (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-ui-diagnostic.yml
      - tools/deadtown-ui-diagnostic.csx

permissions:
  contents: read
  actions: read

jobs:
  coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the incomplete VM data used for RE test 3
        uses: actions/download-artifact@v4
        with:
          name: deadtown-incomplete-game-data
          path: work/game
          run-id: 44517643086
          github-token: ${{ github.token }}
      - name: Regenerate matching source events
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C work/source --strip-components=1
          python tools/stage_deadtown_gmx.py work/source/deadtown.gmx work/staged || test "$?" -eq 1
          python tools/prepare_deadtown_offline.py work/staged work/offline
          python tools/deadtown_event_probe.py work/offline work/events.json
      - name: Download pinned UndertaleModTool CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/utmt
          gh release download 0.9.2.0 -R UnderminersTeam/UndertaleModTool -p 'UTMT_CLI_v0.9.2.0-Ubuntu.zip' -O work/utmt.zip
          echo 'd182f00c0e5ced8d9252aa1f796374cfee077a3889a658e70b68685f9cd559c7  work/utmt.zip' | sha256sum -c
          unzip -q work/utmt.zip -d work/utmt
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          chmod +x "$exe"
          echo "UTMT_EXE=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
      - name: Instrument a disposable copy of the incomplete game
        shell: bash
        env:
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events.json
        run: |
          set -euo pipefail
          mkdir -p work/diagnostic work/save
          cp work/game/audiogroup*.dat work/diagnostic/
          set +e
          "$UTMT_EXE" load work/game/data.win -s tools/deadtown-ui-diagnostic.csx -o work/diagnostic/data.win > work/instrument.log 2>&1
          status=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          for line in Path('work/instrument.log').read_text(errors='replace').splitlines()[-25:]:
              print('::notice::UI_INSTRUMENT: ' + line.replace('%', '%25')[:800])
          PY
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -s work/diagnostic/data.win
      - uses: actions/cache/restore@v4
        id: runner-cache
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Trace display and GUI coordinates (desktop headless)
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.runner-cache.outputs.cache-hit }}' = 'true'
          test -x work/runner-build/gmrunner
          if ldd work/runner-build/gmrunner | grep -q 'not found'; then
            timeout 120 sudo apt-get install -y -qq libsdl2-2.0-0 libbz2-1.0
          fi
          timeout 90 work/runner-build/gmrunner work/diagnostic --headless --fast --mute --seed 1 \
            --frames 210 --trace --goto rom_play@160 --save-dir work/save > work/coords.log 2>&1
          grep -F '[room] -> rom_play' work/coords.log >/dev/null
          python - <<'PY'
          from pathlib import Path
          lines = [line for line in Path('work/coords.log').read_text(errors='replace').splitlines() if 'DT_COORDS' in line]
          if not lines:
              raise SystemExit('::error::sys_view coordinate instrumentation did not run')
          for line in lines:
              print('::notice::HEADLESS_COORDS: ' + line.replace('%', '%25')[:800])
          print('::notice::Headless desktop metrics only; not iOS or original APK behavior.')
          PY
      - name: Preserve diagnostic log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-ui-coordinate-log
          path: work/coords.log
          if-no-files-found: ignore
          retention-days: 3
