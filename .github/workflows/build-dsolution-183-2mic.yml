name: Bruce build (DSolution 1.83 2-Mic)

# Compiles the DSolution 1.83" 2-Mic board port against the pinned Bruce revision.
# The sandbox that produced the port has no cross toolchain, so this workflow is the
# compile check: it clones upstream Bruce, applies firmware/dsolution-183-2mic-bruce.patch
# and runs the board's PlatformIO environment end to end.
#
# The size/link report at the end is emitted as workflow annotations (::notice::) because
# the artifact and raw log endpoints are not reachable from the sandbox: `gh run view`
# prints them.

on:
  push:
    branches:
      - arena/99e7eeb4-arenaaiworkspace-1
    paths:
      - 'firmware/dsolution-183-2mic-bruce.patch'
      - '.github/workflows/build-dsolution-183-2mic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream Bruce at the pin the patch was made against
        run: |
          git clone --filter=blob:none https://github.com/pr3y/Bruce.git /tmp/Bruce
          cd /tmp/Bruce
          git fetch --depth 1 origin 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
          git checkout 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
          git submodule update --init --recursive

      - name: Apply the board port
        run: git -C /tmp/Bruce apply --verbose "$GITHUB_WORKSPACE/firmware/dsolution-183-2mic-bruce.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/dsolution-183-2mic-bruce.patch') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build dsolution-183-2mic
        working-directory: /tmp/Bruce
        run: |
          set -o pipefail
          pio run -e dsolution-183-2mic 2>&1 | tee build.log

      - name: Build report (sizes + link check)
        if: always()
        working-directory: /tmp/Bruce
        run: |
          BIN=.pio/build/dsolution-183-2mic/firmware.bin
          ELF=.pio/build/dsolution-183-2mic/firmware.elf
          NM=$(find "$HOME/.platformio/packages" -name 'xtensa-esp32s3-elf-nm' 2>/dev/null | head -1)
          {
            echo "RAM/Flash: $(grep -E '^(RAM|Flash):' build.log | tr -s ' ' | tr '\n' ' ')"
            echo "binary: $(ls -l "$BIN" 2>/dev/null | awk '{print $5}') bytes"
            # Bruce builds with -flto, so board functions are usually inlined into their
            # only caller and gone from the final ELF. Check the pre-LTO objects instead,
            # and prove the image really contains this board's code by looking for the
            # banner string in the binary.
            IFACE_OBJ=$(find .pio/build/dsolution-183-2mic -name 'interface.cpp.o' | head -1)
            LOVYAN_OBJ=$(find .pio/build/dsolution-183-2mic -name 'lovyan.cpp.o' | head -1)
            echo "interface object: ${IFACE_OBJ:-MISSING}"
            if [ -n "$IFACE_OBJ" ] && [ -n "$NM" ]; then
              echo "board symbols: $(for s in _setup_gpio _setup_codec_speaker _setup_codec_mic InputHandler isCharging powerOff; do "$NM" -C "$IFACE_OBJ" | grep -qE " [Tt] $s$" && echo "$s" ; done | tr '\n' ' ')"
            fi
            if [ -n "$LOVYAN_OBJ" ] && [ -n "$NM" ]; then
              echo "panel class: $(for s in getInitCommands getMadCtl setRotation; do "$NM" -C "$LOVYAN_OBJ" | grep -q "Panel_NV3030B::$s" && echo "$s"; done | tr '\n' ' ')"
            fi
            if grep -aq "DSolution 1.83 2-Mic" "$BIN" 2>/dev/null; then
              echo "banner string: present in firmware.bin"
            else
              echo "banner string: NOT FOUND in firmware.bin"
            fi
            FACTORY=.pio/build/dsolution-183-2mic/firmware-factory.bin
            if [ -f "$FACTORY" ]; then
              echo "factory image: $(ls -l "$FACTORY" | awk '{print $5}') bytes (flash at 0x0)"
            else
              echo "factory image: MISSING -- merge step output: $(grep -i '\[merge_bin\]' build.log | tail -3 | tr '\n' ' ')"
            fi
            echo "warnings in board files: $(grep -icE 'warning:.*(NV3030B|dsolution|interface\.cpp|mic\.cpp)' build.log)"
          } > report.txt
          cat report.txt
          # One annotation per line, the first 10 are the ones GitHub keeps.
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=build report::$line"; done < report.txt

      - name: Rename the single flashable image
        if: always()
        run: |
          src=/tmp/Bruce/.pio/build/dsolution-183-2mic/firmware-factory.bin
          [ -f "$src" ] && cp "$src" DSolution-183-2mic-factory.bin
          ls -l DSolution-183-2mic-factory.bin 2>/dev/null || echo "no factory image produced"

      - name: Upload firmware (one .bin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSolution-183-2mic-factory
          path: DSolution-183-2mic-factory.bin
          if-no-files-found: warn
