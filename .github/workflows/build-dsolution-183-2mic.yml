name: Bruce build (DSolution 1.83 2-Mic)

# Compiles the DSolution 1.83" 2-Mic board port against the pinned Bruce revision.
# The sandbox that produced the port has no cross toolchain, so this workflow is the
# compile check: it clones upstream Bruce, applies firmware/dsolution-183-2mic-bruce.patch
# + firmware/dsolution-183-2mic-displaydrivers.patch, builds with BRUCE_OFFLINE_WEB_ASSETS=1,
# and emits both factory (0x0) and Dual-OTA (.bin) firmware images.

on:
  push:
    branches:
      - arena/99e7eeb4-arenaaiworkspace-1
      - arena/8d69f494-arenaaiworkspace-1
    paths:
      - 'firmware/dsolution-183-2mic-bruce.patch'
      - 'firmware/dsolution-183-2mic-displaydrivers.patch'
      - 'firmware/dualboot-launcher/**'
      - '.github/workflows/build-dsolution-183-2mic.yml'
  workflow_dispatch:

jobs:
  build-dualboot-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: espressif/idf:v5.4
    defaults:
      run:
        shell: bash
    steps:
      - name: Allow git workspace in container
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Build Dual-Boot custom bootloader + NV3023 Boot Menu
        working-directory: firmware/dualboot-launcher
        run: |
          set +e
          if [ -f /opt/esp/idf/export.sh ]; then
            . /opt/esp/idf/export.sh
          elif [ -n "${IDF_PATH:-}" ] && [ -f "$IDF_PATH/export.sh" ]; then
            . "$IDF_PATH/export.sh"
          fi
          idf.py set-target esp32s3 > idf-build.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            idf.py build >> idf-build.log 2>&1
            RC=$?
          fi
          if [ $RC -ne 0 ]; then
            ERR=$(grep -E '(: error:|fatal error:|FAILED:|CMake Error|undefined reference|ninja: build stopped|Error:)' idf-build.log | head -n 15 || true)
            [ -z "$ERR" ] && ERR=$(tail -n 25 idf-build.log || true)
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=idf-build::$line"
            done <<< "$ERR"
            tail -n 60 idf-build.log || true
            exit $RC
          fi

      - name: Report Dual-Boot build
        working-directory: firmware/dualboot-launcher
        run: |
          BOOTLOADER_BIN=build/bootloader/bootloader.bin
          MENU_BIN=build/dualboot_launcher.bin
          PART_BIN=build/partition_table/partition-table.bin
          ls -lh "$BOOTLOADER_BIN" "$MENU_BIN" "$PART_BIN"
          BOOT_SIZE=$(stat -c%s "$BOOTLOADER_BIN")
          MENU_SIZE=$(stat -c%s "$MENU_BIN")
          if [ "$BOOT_SIZE" -gt 28672 ]; then
            echo "::error title=bootloader size::Bootloader size $BOOT_SIZE exceeds 28 KB limit before 0x8000"
            exit 1
          fi
          if [ "$MENU_SIZE" -gt 262144 ]; then
            echo "::error title=menu size::Dual-Boot Menu size $MENU_SIZE exceeds 256 KB (0x40000) factory slot"
            exit 1
          fi
          echo "::notice title=dualboot report::bootloader=${BOOT_SIZE} B, dualboot_menu=${MENU_SIZE} B"
          mkdir -p dist
          cp "$BOOTLOADER_BIN" dist/bootloader_dualboot.bin
          cp "$MENU_BIN" dist/dualboot_menu.bin
          cp "$PART_BIN" dist/partition-table-default.bin

      - name: Upload Dual-Boot Launcher Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSolution-183-2mic-dualboot-launcher
          path: firmware/dualboot-launcher/dist/*
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream Bruce at the pin the patch was made against
        run: |
          git clone --filter=blob:none https://github.com/pr3y/Bruce.git /tmp/Bruce
          cd /tmp/Bruce
          git fetch --depth 1 origin 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
          git checkout 2b6ba4d490bfcf94ce2574c6154537dbd5838c3d
          git submodule update --init --recursive

      - name: Apply the board port & DisplayDrivers patches
        run: |
          git -C /tmp/Bruce apply --verbose "$GITHUB_WORKSPACE/firmware/dsolution-183-2mic-bruce.patch"
          git -C /tmp/Bruce/lib/DisplayDrivers apply --verbose "$GITHUB_WORKSPACE/firmware/dsolution-183-2mic-displaydrivers.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/dsolution-183-2mic-bruce.patch', 'firmware/dsolution-183-2mic-displaydrivers.patch') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build dsolution-183-2mic
        working-directory: /tmp/Bruce
        env:
          BRUCE_OFFLINE_WEB_ASSETS: '1'
        run: |
          set -o pipefail
          pio run -e dsolution-183-2mic 2>&1 | tee build.log

      - name: Build report (sizes + link check)
        if: always()
        working-directory: /tmp/Bruce
        run: |
          BIN=.pio/build/dsolution-183-2mic/firmware.bin
          FACTORY=.pio/build/dsolution-183-2mic/firmware-factory.bin
          NM=$(find "$HOME/.platformio/packages" -name 'xtensa-esp32s3-elf-nm' 2>/dev/null | head -1)
          {
            echo "RAM/Flash: $(grep -E '^(RAM|Flash):' build.log | tr -s ' ' | tr '\n' ' ')"
            echo "ota binary: $(ls -l "$BIN" 2>/dev/null | awk '{print $5}') bytes (Dual-OTA 4MB slot)"
            IFACE_OBJ=$(find .pio/build/dsolution-183-2mic -name 'interface.cpp.o' | head -1)
            LOVYAN_OBJ=$(find .pio/build/dsolution-183-2mic -name 'lovyan.cpp.o' | head -1)
            echo "interface object: ${IFACE_OBJ:-MISSING}"
            if [ -n "$IFACE_OBJ" ] && [ -n "$NM" ]; then
              echo "board symbols: $(for s in _setup_gpio _setup_codec_speaker _setup_codec_mic InputHandler isCharging powerOff getBatteryMv enterBootloaderMode; do "$NM" -C "$IFACE_OBJ" | grep -qE " [TtWw] ${s}(\(|$)" && echo "$s" ; done | tr '\n' ' ')"
            fi
            if [ -n "$LOVYAN_OBJ" ] && [ -n "$NM" ]; then
              echo "panel class: $(for s in getInitCommands getMadCtl setRotation; do "$NM" -C "$LOVYAN_OBJ" | grep -q "Panel_NV3023::$s" && echo "$s"; done | tr '\n' ' ')"
            fi
            if grep -aq "DSolution 1.83 2-Mic" "$BIN" 2>/dev/null; then
              echo "banner string: present in firmware.bin"
            else
              echo "banner string: NOT FOUND in firmware.bin"
            fi
            if [ -f "$FACTORY" ]; then
              echo "factory image: $(ls -l "$FACTORY" | awk '{print $5}') bytes (flash at 0x0)"
            else
              echo "factory image: MISSING -- merge step output: $(grep -i '\[merge_bin\]' build.log | tail -3 | tr '\n' ' ')"
            fi
            echo "warnings in board files: $(grep -icE 'warning:.*(NV3023|dsolution|interface\.cpp|mic\.cpp|feature_guide)' build.log)"
          } > report.txt
          cat report.txt
          if [ ! -f "$BIN" ] || [ ! -f "$FACTORY" ]; then
            ERR_LINES=$(grep -E '(: error:|fatal error:|undefined reference|multiple definition|No such file|BuildError|Traceback|Error:|\*\*\* \[)' build.log | head -n 10)
            if [ -z "$ERR_LINES" ]; then
              ERR_LINES=$(tail -n 10 build.log)
            fi
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=build error::$line"
            done <<< "$ERR_LINES"
          fi
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=build report::$line"; done < report.txt

      - name: Publish build diagnostics issue
        if: failure()
        working-directory: /tmp/Bruce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build diagnostics for run ${GITHUB_RUN_ID}."
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "## Report"
            echo '```'
            cat report.txt 2>/dev/null || echo "report.txt missing"
            echo '```'
            echo ""
            echo "## Compiler / linker errors"
            echo '```'
            grep -aE '(: error:|fatal error:|undefined reference|multiple definition|No such file|BuildError|Traceback|Error:|\*\*\* \[)' build.log 2>/dev/null | tail -n 120 || true
            echo '```'
            echo ""
            echo "## Build log tail"
            echo '```'
            tail -n 120 build.log 2>/dev/null | sed -r 's/\x1B\[[0-9;]*[mK]//g' || true
            echo '```'
          } > /tmp/build-diagnostic.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build diagnostics run ${GITHUB_RUN_ID}" \
            --body-file /tmp/build-diagnostic.md

      - name: Stage firmware artifacts (factory + ota)
        if: always()
        run: |
          FACTORY=/tmp/Bruce/.pio/build/dsolution-183-2mic/firmware-factory.bin
          OTA=/tmp/Bruce/.pio/build/dsolution-183-2mic/firmware.bin
          [ -f "$FACTORY" ] && cp "$FACTORY" DSolution-183-2mic-factory.bin
          [ -f "$OTA" ] && cp "$OTA" DSolution-183-2mic-ota.bin
          ls -l DSolution-183-2mic-*.bin 2>/dev/null || echo "no firmware images produced"

      - name: Upload Factory Image (flash at 0x0)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSolution-183-2mic-factory
          path: DSolution-183-2mic-factory.bin
          if-no-files-found: warn

      - name: Upload Dual-OTA App Binary (for WebOTA /ota)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSolution-183-2mic-ota
          path: DSolution-183-2mic-ota.bin
          if-no-files-found: warn

  publish-release:
    needs: [build-dualboot-launcher, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update dualboot-latest pre-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          find artifacts -type f -name '*.bin' -exec cp {} release-files/ \;
          ls -lh release-files/
          if gh release view dualboot-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload dualboot-latest release-files/*.bin --clobber --repo "${{ github.repository }}"
          else
            gh release create dualboot-latest release-files/*.bin \
              --repo "${{ github.repository }}" \
              --title "DSolution 1.83 2-Mic Dual-Boot & Bruce Firmware" \
              --notes "Latest CI-built Dual-Boot bootloader, NV3023 Boot Menu, and Bruce firmware images." \
              --prerelease
          fi
