name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: logic only, no GPU, no Windows needed.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: web mock syntax
        run: node --check ../web/app.js

      - name: mock backend integration
        run: node --test ../mock-server/server.test.js

      - name: standalone exe tests
        run: cargo test --manifest-path ../app/Cargo.toml

      - name: standalone exe clippy
        run: cargo clippy --manifest-path ../app/Cargo.toml --all-targets -- -D warnings

      - name: standalone exe smoke check
        run: cargo run --manifest-path ../app/Cargo.toml -- --check

      - name: print pipelines (reviewable in the log)
        run: cargo run --quiet -- --demo

  # The artefact you actually download and run on the laptop.
  build-windows:
    name: build rd.exe (windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      - name: build
        run: cargo build --release

      - name: smoke-run
        run: .\target\release\rd.exe --demo

      - name: build Lantern mock app
        run: cargo build --manifest-path ..\app\Cargo.toml --release

      - name: smoke-check Lantern mock app
        run: ..\app\target\release\lantern-mock.exe --check

      - name: prepare portable preview package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'app\dist'
          $portable = Join-Path $dist 'Lantern-Phase0-Portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item '..\app\target\release\lantern-mock.exe' (Join-Path $portable 'lantern-mock.exe')
          Copy-Item '..\app\README.md' (Join-Path $portable 'README.txt')
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath (Join-Path $dist 'Lantern-Phase0-Portable.zip') -Force

      - name: install Inno Setup compiler
        run: choco install innosetup --yes --no-progress

      - name: build per-user installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "..\app\installer\LanternPhase0.iss"'

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-phase0-portable-windows-x64
          path: app/dist/Lantern-Phase0-Portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-phase0-setup-windows-x64
          path: app/dist/Lantern-Phase0-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: rd-windows-x64
          path: spike/target/release/rd.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-mock-windows-x64
          path: app/target/release/lantern-mock.exe
          if-no-files-found: error
