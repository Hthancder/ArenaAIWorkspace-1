name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: logic only, no GPU, no Windows needed.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      # §57.9: log của job này **không tải được** trong sandbox (blob storage bị
      # chặn, xem §56.10), nên lỗi clippy được phát lại dưới dạng *annotation*
      # — thứ đọc được qua api.github.com. Không đổi ngữ nghĩa: vẫn `-D warnings`.
      - name: clippy
        run: |
          set +e
          cargo clippy --all-targets --message-format=json -- -D warnings > /tmp/clippy.json
          status=$?
          set -e
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error") | "\(.spans[0].file_name // "?"):\(.spans[0].line_start // 0): \(.message)"' /tmp/clippy.json 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do echo "::error::clippy: $line"; done
          exit $status

      - name: test
        run: cargo test --all-targets

      - name: web mock syntax
        run: node --check ../web/app.js

      - name: mock backend integration (incl. T5 innerHTML guard)
        run: node --test ../mock-server/server.test.js

      # §57: mỗi luật [CỨNG] của §41 phải xuất hiện trong log CI, không chỉ
      # trong file test. Đọc bằng mắt được ngay trên trang run.
      - name: security conformance summary
        run: |
          cargo test --test spec_conformance 2>&1 | grep -E "security_conformance::" | sed 's/^test security_conformance:://'

      # §57.9 + §58.12: log job này **không tải được** trong sandbox, nên khi
      # test app đỏ thì đẩy tên test + thông báo lỗi ra *annotation*. Đã có lần
      # CI đỏ ở đây mà chỉ đọc được "exit code 101" — vô dụng.
      - name: standalone exe tests
        run: |
          set +e
          cargo test --manifest-path ../app/Cargo.toml > /tmp/app-test.log 2>&1
          status=$?
          set -e
          cat /tmp/app-test.log
          if [ $status -ne 0 ]; then
            grep -E "^test .* FAILED|^---- .* stdout ----|panicked at|assertion|^failures:" /tmp/app-test.log | head -30 | while IFS= read -r line; do echo "::error::app test: $line"; done
          fi
          exit $status

      - name: standalone exe clippy
        run: cargo clippy --manifest-path ../app/Cargo.toml --all-targets -- -D warnings

      - name: standalone exe smoke check
        run: cargo run --manifest-path ../app/Cargo.toml -- --check

      - name: print pipelines (reviewable in the log)
        run: cargo run --quiet -- --demo

  # The artefact you actually download and run on the laptop.
  build-windows:
    name: build rd.exe (windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      - name: build
        run: cargo build --release

      - name: smoke-run
        run: .\target\release\rd.exe --demo

      - name: build Lantern mock app
        run: cargo build --manifest-path ..\app\Cargo.toml --release

      - name: smoke-check Lantern mock app
        run: ..\app\target\release\lantern-mock.exe --check

      - uses: actions/upload-artifact@v4
        with:
          name: rd-windows-x64
          path: spike/target/release/rd.exe
          if-no-files-found: error

      # §58.13: tải sẵn GStreamer runtime + gói vào **cùng** artifact. Người
      # dùng cuối không phải cài gì, không phải sửa PATH — giải nén là chạy.
      # Bản cài trong máy (nếu có) không bị dùng tới, nên không có chuyện
      # "GStreamer cũ trong PATH làm thiếu plugin".
      - name: download GStreamer runtime (MSVC 64-bit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '1.24.10'
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'gstreamer.zip'
          Write-Host "Tải $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          } catch {
            # Log job không tải được từ sandbox (§56.10) ⇒ đẩy lỗi ra annotation,
            # nếu không thì chỉ đọc được "exit code 1".
            Write-Output "::error::GStreamer download: $($_.Exception.Message)"
            exit 1
          }
          $size = (Get-Item $zip).Length
          Write-Host "Đã tải $([math]::Round($size / 1MB, 1)) MB"
          $gst = 'app/target/release/gst'
          New-Item -ItemType Directory -Force -Path $gst | Out-Null
          tar -xf $zip -C $gst
          $exe = Join-Path $gst 'bin/gst-launch-1.0.exe'
          if (-not (Test-Path $exe)) { throw "Gói tải về không có bin/gst-launch-1.0.exe" }
          # Kiểm **ngay trong CI** rằng bản đóng gói có plugin d3d11 — nếu không
          # thì ta sẽ giao một artifact hỏng mà không ai biết cho tới khi bạn bấm nút.
          Push-Location (Join-Path $gst 'bin')
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = Join-Path $gst 'lib/gstreamer-1.0'
          $env:GST_PLUGIN_PATH_1_0 = ''
          ./gst-inspect-1.0.exe d3d11screencapturesrc | Select-Object -First 6
          if ($LASTEXITCODE -ne 0) { throw "Bản đóng gói thiếu plugin d3d11screencapturesrc" }
          ./gst-inspect-1.0.exe jpegenc | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "Bản đóng gói thiếu jpegenc" }
          Pop-Location
          # Bỏ thư mục dev không cần cho chạy: giảm ~50% kích thước artifact.
          foreach ($drop in @('lib/gstreamer-1.0/gst-plugin-scanner.exe', 'share', 'include')) {
            Remove-Item -Recurse -Force (Join-Path $gst $drop) -ErrorAction SilentlyContinue
          }
          Write-Host "Kích thước gst: $([math]::Round((Get-ChildItem $gst -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-mock-windows-x64
          path: |
            app/target/release/lantern-mock.exe
            app/target/release/gst/
          if-no-files-found: error
