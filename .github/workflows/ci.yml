name: Build

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test + Build Release
        id: build
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo "===== cargo test =====" | tee ci-log.txt
          cargo test --verbose 2>&1 | tee -a ci-log.txt || status=1
          echo "===== cargo build --release =====" | tee -a ci-log.txt
          cargo build --release 2>&1 | tee -a ci-log.txt || status=1
          exit $status

      - name: Đổi tên file exe
        shell: pwsh
        run: |
          Copy-Item target\release\Taskora.exe Taskora.exe
          Get-Item Taskora.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taskora-Windows-x64
          path: Taskora.exe
          if-no-files-found: error

      - name: Tạo GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" Taskora.exe --generate-notes
        shell: pwsh

      # Đẩy log lỗi về một branch để đọc qua git (log Actions dùng Azure blob – không truy cập được từ sandbox)
      - name: Đẩy log lỗi (nếu fail)
        if: failure()
        shell: bash
        run: |
          git config user.name "Taskora CI"
          git config user.email "ci@taskora.local"
          git checkout -B ci-logs
          cp ci-log.txt ci-errors.txt 2>/dev/null || echo "no log" > ci-errors.txt
          git add ci-errors.txt
          git commit -m "CI error log ${GITHUB_RUN_ID}" || true
          git push -f origin ci-logs
