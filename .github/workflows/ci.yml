name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: logic only, no GPU, no Windows needed.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      # §57.9: log của job này **không tải được** trong sandbox (blob storage bị
      # chặn, xem §56.10), nên lỗi clippy được phát lại dưới dạng *annotation*
      # — thứ đọc được qua api.github.com. Không đổi ngữ nghĩa: vẫn `-D warnings`.
      - name: clippy
        run: |
          set +e
          cargo clippy --all-targets --message-format=json -- -D warnings > /tmp/clippy.json
          status=$?
          set -e
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error") | "\(.spans[0].file_name // "?"):\(.spans[0].line_start // 0): \(.message)"' /tmp/clippy.json 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do echo "::error::clippy: $line"; done
          exit $status

      - name: test
        run: cargo test --all-targets

      - name: web mock syntax
        run: node --check ../web/app.js

      - name: mock backend integration (incl. T5 innerHTML guard)
        run: node --test ../mock-server/server.test.js

      # §57: mỗi luật [CỨNG] của §41 phải xuất hiện trong log CI, không chỉ
      # trong file test. Đọc bằng mắt được ngay trên trang run.
      - name: security conformance summary
        run: |
          cargo test --test spec_conformance 2>&1 | grep -E "security_conformance::" | sed 's/^test security_conformance:://'

      # §57.9 + §58.12: log job này **không tải được** trong sandbox, nên khi
      # test app đỏ thì đẩy tên test + thông báo lỗi ra *annotation*. Đã có lần
      # CI đỏ ở đây mà chỉ đọc được "exit code 101" — vô dụng.
      - name: standalone exe tests
        run: |
          set +e
          cargo test --manifest-path ../app/Cargo.toml > /tmp/app-test.log 2>&1
          status=$?
          set -e
          cat /tmp/app-test.log
          if [ $status -ne 0 ]; then
            grep -E "^test .* FAILED|^---- .* stdout ----|panicked at|assertion|^failures:" /tmp/app-test.log | head -30 | while IFS= read -r line; do echo "::error::app test: $line"; done
          fi
          exit $status

      # §57.9: log không tải được ⇒ đẩy từng lint ra annotation.
      - name: standalone exe clippy
        run: |
          set +e
          cargo clippy --manifest-path ../app/Cargo.toml --all-targets --message-format=json -- -D warnings > /tmp/app-clippy.json
          status=$?
          set -e
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error") | "\(.spans[0].file_name // "?"):\(.spans[0].line_start // 0): \(.message)"' /tmp/app-clippy.json 2>/dev/null | sort -u | head -20 | while IFS= read -r line; do echo "::error::app clippy: $line"; done
          exit $status

      # §58.20: nhánh `#[cfg(windows)]` được biên dịch **trên Linux** với mọi
      # gate lật ngược. Bắt dead_code/unused_mut/lỗi kiểu của nhánh Windows
      # trong ~1 giây thay vì chờ tới job Windows. Không thay thế build Windows.
      - name: windows branch compiles on linux
        run: ../scripts/check-windows-shape.py

      - name: standalone exe smoke check
        run: cargo run --manifest-path ../app/Cargo.toml -- --check

      - name: print pipelines (reviewable in the log)
        run: cargo run --quiet -- --demo

  # The artefact you actually download and run on the laptop.
  build-windows:
    name: build rd.exe (windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      - name: build
        run: cargo build --release

      - name: smoke-run
        run: .\target\release\rd.exe --demo

      # §57.9: log không tải được ⇒ đẩy lỗi biên dịch ra annotation.
      - name: build Lantern mock app
        shell: pwsh
        run: |
          # `2>$null` từng nuốt **toàn bộ** stderr, gồm cả lỗi linker và lỗi
          # "failed to run custom build command" — những thứ không xuất hiện dưới
          # dạng `compiler-message` trong JSON. Kết quả: step đỏ, log không tải
          # được từ sandbox, và annotation rỗng ⇒ **không có cách nào biết lỗi
          # gì** trong 3 vòng CI liền. Giờ giữ stderr vào file và in ra.
          cargo build --manifest-path ..\app\Cargo.toml --release --message-format=json > build.json 2> build.err
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $reported = 0
            Get-Content build.json -ErrorAction SilentlyContinue | ForEach-Object {
              try {
                $m = $_ | ConvertFrom-Json
                if ($m.reason -eq 'compiler-message' -and $m.message.level -eq 'error') {
                  $span = $m.message.spans | Select-Object -First 1
                  Write-Output "::error::rustc: $($span.file_name):$($span.line_start) $($m.message.message)"
                  $reported++
                }
              } catch { }
            }
            # Không có compiler-message nào ⇒ lỗi ở tầng khác (linker, build
            # script, cargo). In 25 dòng stderr cuối: đủ để thấy lý do thật.
            if ($reported -eq 0 -and (Test-Path build.err)) {
              $lines = Get-Content build.err | Select-Object -Last 25
              foreach ($line in $lines) {
                Write-Output "::error::build: $line"
              }
            }
          }
          exit $status

      # Log của job không tải được từ sandbox, nên mọi thứ cần đọc phải đi qua
      # `::error::`. Bản trước chỉ có `--check` và khi nó trả 1 thì annotation
      # duy nhất là "Process completed with exit code 1" — không nói được
      # *dòng nào*, và đã tốn hai vòng CI đoán mò.
      - name: smoke-check Lantern mock app
        shell: pwsh
        run: |
          ..\app\target\release\lantern-mock.exe --check *>&1 | Tee-Object -FilePath check.out
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error::--check trả $status"
            Get-Content check.out -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object {
              Write-Output "::error::check: $_"
            }
          }
          exit $status

      # **Đây là bước duy nhất chứng minh sản phẩm dùng được thật.**
      #
      # `--check` chỉ nói *mã nguồn* biên dịch và encoder chạy. Nó không nói
      # `Capture::open` có mở được DXGI, `AcquireNextFrame` có trả frame, và
      # `jpeg::encode` có sinh ra ảnh **giải mã được**. Ba thứ đó chính là sản
      # phẩm — và cả ba từng hỏng cùng lúc trên Windows trong khi 167 test
      # Linux xanh (GUID sai, struct tràn stack, 11 chỗ đọc vtable sai).
      #
      # Cách kiểm: chạy exe, tạo một phiên, tải `/api/live.mjpg`, cắt frame
      # JPEG đầu tiên ra file, rồi **giải mã nó**. Nếu bước này xanh thì trên
      # một máy Windows bất kỳ, cùng đường đó cho ra ảnh thật.
      - name: chạy thật — chụp màn hình và giải mã frame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Resolve-Path '..\app\target\release\lantern-mock.exe'
          $data = Join-Path $env:TEMP 'lantern-ci'
          $log = Join-Path $env:TEMP 'lantern.out'
          $p = Start-Process -FilePath $exe -ArgumentList '--data-dir', $data -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          try {
            # Chờ cổng: log in `127.0.0.1:<port>` sau khi bind.
            $port = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $log) {
                $m = Select-String -Path $log -Pattern '127\.0\.0\.1:(\d+)' | Select-Object -First 1
                if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
              }
              if ($p.HasExited) { break }
            }
            if (-not $port) {
              Write-Output "::error::exe không mở được cổng. Đầu ra:"
              Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 20 | ForEach-Object { Write-Output "::error::  $_" }
              exit 1
            }
            Write-Host "== exe đang nghe ở cổng $port"

            $base = "http://127.0.0.1:$port"
            $health = Invoke-RestMethod -Uri "$base/api/health" -TimeoutSec 10
            Write-Host "== health: mode=$($health.mode) capture=$($health.capture)"

            # Tạo phiên toàn màn hình — đúng đường người dùng bấm.
            try {
              $session = Invoke-RestMethod -Uri "$base/api/sessions" -Method Post -ContentType 'application/json' `
                -Body '{"mode":"vnc","windowId":"desktop"}' -TimeoutSec 10
              Write-Host "== phiên: $($session.session.id)"
            } catch {
              Write-Output "::error::tạo phiên thất bại: $($_.Exception.Message)"
              Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 20 | ForEach-Object { Write-Output "::error::  $_" }
              exit 1
            }

            $status = Invoke-RestMethod -Uri "$base/api/live/status" -TimeoutSec 10
            Write-Host "== live: available=$($status.available) — $($status.detail)"
            if (-not $status.available) {
              # Runner không có desktop tương tác — nói rõ, không giả vờ xanh.
              Write-Output "::warning::SKIPPED — không capture được trên runner này ($($status.detail))."
              exit 0
            }

            # Tải stream: nó chạy vô hạn, nên đọc tới khi có >= 2 frame rồi cắt.
            $req = [System.Net.HttpWebRequest]::Create("$base/api/live.mjpg?monitor=0&fps=5")
            $req.Timeout = 20000
            $req.ReadWriteTimeout = 20000
            $resp = $req.GetResponse()
            $stream = $resp.GetResponseStream()
            $all = New-Object System.IO.MemoryStream
            $buf = New-Object byte[] 16384
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              $n = $stream.Read($buf, 0, $buf.Length)
              if ($n -le 0) { break }
              $all.Write($buf, 0, $n)
              # Đếm SOI/EOI: hai frame là đủ để biết stream sống.
              $bytes = $all.ToArray()
              $frames = 0; $i = 0
              while ($i -lt $bytes.Length - 1) {
                if ($bytes[$i] -eq 0xFF -and $bytes[$i+1] -eq 0xD8) { $soi++ }
                if ($bytes[$i] -eq 0xFF -and $bytes[$i+1] -eq 0xD9) { $frames++ }
                $i++
              }
              if ($frames -ge 2) { break }
            }
            $resp.Close()
            $bytes = $all.ToArray()
            Write-Host "== nhận $($bytes.Length) byte"

            # Cắt frame đầu tiên: từ SOI tới EOI (tính cả 2 byte của EOI).
            $start = -1; $end = -1
            for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
              if ($start -lt 0 -and $bytes[$i] -eq 0xFF -and $bytes[$i+1] -eq 0xD8) { $start = $i }
              elseif ($start -ge 0 -and $bytes[$i] -eq 0xFF -and $bytes[$i+1] -eq 0xD9) { $end = $i + 1; break }
            }
            if ($start -lt 0 -or $end -le $start) {
              Write-Output "::error::không tìm thấy frame JPEG hoàn chỉnh trong stream ($($bytes.Length) byte)"
              exit 1
            }
            $frame = New-Object byte[] ($end - $start + 1)
            [Array]::Copy($bytes, $start, $frame, 0, $frame.Length)
            $jpeg = Join-Path $env:TEMP 'frame.jpg'
            [System.IO.File]::WriteAllBytes($jpeg, $frame)
            Write-Host "== frame: $($frame.Length) byte -> $jpeg"

            # **Giải mã** bằng bộ giải mã của .NET (độc lập với encoder Rust).
            # Chỉ kiểm SOI/EOI là chưa đủ: một ảnh hỏng vẫn có thể có hai marker.
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile($jpeg)
            $w = $img.Width; $h = $img.Height
            $img.Dispose()
            Write-Host "== giải mã được: $w×$h"
            if ($w -lt 640 -or $h -lt 480) {
              Write-Output "::error::Frame quá nhỏ ($w×$h) — capture sai màn hình?"
              exit 1
            }
            # Đưa kết quả ra annotation để đọc được từ sandbox (log job không tải
            # được). Không có dòng này thì "success" có thể là "đã bỏ qua".
            Write-Output "::notice::FRAME THẬT: $($frame.Length) byte, giải mã $w×$h, mode=$($health.mode), capture=$($health.capture)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rd-windows-x64
          path: spike/target/release/rd.exe
          if-no-files-found: error

      # §58.15: KHÔNG còn GStreamer. Bản v3.31 mượn `d3d11screencapturesrc` +
      # `jpegenc`, kéo theo installer 517 MB — sai với người dùng cá nhân. Bản
      # v3.32 tự gọi DXGI Desktop Duplication qua COM và tự nén JPEG (~300 dòng
      # Rust thuần). Artifact: exe ~2 MB, **không cài gì**.
      #
      # Bước này kiểm đúng thứ người dùng cần: exe tự chạy, tự báo capture được
      # hay không, và **không** phụ thuộc file ngoài nào.
      - name: verify the exe is self-contained
        shell: pwsh
        run: |
          # Chú ý: job này chạy với working-directory = spike, nên đường dẫn
          # tới app phải có ".." — thiếu nó thì Get-Item ném lỗi, step đỏ mà
          # không in ra ::error:: nào (đã xảy ra 2 vòng CI liên tiếp).
          $exe = '..\app\target\release\lantern-mock.exe'
          if (-not (Test-Path $exe)) { Write-Output "::error::Không thấy $exe"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "== lantern-mock.exe: $size MB (không kèm runtime nào)"
          # Không được có thư mục gst/ bên cạnh — nếu có nghĩa là ta lại quay
          # về hướng "tải 517 MB", thứ vừa bị bỏ.
          if (Test-Path '..\app\target\release\gst') { Write-Output "::error::Còn thư mục gst/ — artifact lại phình to"; exit 1 }
          & $exe --check
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::--check thất bại"; exit 1 }
          Write-Host "== exe tự kiểm xong (capture + JPEG nằm trong binary)"

      # Đẩy cả kích thước ra annotation để đọc được mà không cần tải log
      # (log của job Windows không tải được trong sandbox).
      - name: report exe size
        shell: pwsh
        run: |
          $bytes = (Get-Item '..\app\target\release\lantern-mock.exe').Length
          Write-Output "::notice::lantern-mock.exe = $([math]::Round($bytes/1KB)) KB ($([math]::Round($bytes/1MB,2)) MB), không cần cài gì"

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-mock-windows-x64
          path: app/target/release/lantern-mock.exe
          if-no-files-found: error
