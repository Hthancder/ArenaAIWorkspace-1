name: Build

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Chạy test
        run: cargo test --verbose

      - name: Build Release
        run: cargo build --release

      - name: Đổi tên file exe
        shell: pwsh
        run: |
          Copy-Item target\release\Taskora.exe Taskora.exe
          Get-Item Taskora.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taskora-Windows-x64
          path: Taskora.exe
          if-no-files-found: error

      - name: Tạo GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" Taskora.exe --generate-notes
        shell: pwsh
