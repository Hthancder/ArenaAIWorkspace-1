name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # §58.13: để CI tự đẩy chẩn đoán lên nhánh ci-diag

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: logic only, no GPU, no Windows needed.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      # §57.9: log của job này **không tải được** trong sandbox (blob storage bị
      # chặn, xem §56.10), nên lỗi clippy được phát lại dưới dạng *annotation*
      # — thứ đọc được qua api.github.com. Không đổi ngữ nghĩa: vẫn `-D warnings`.
      - name: clippy
        run: |
          set +e
          cargo clippy --all-targets --message-format=json -- -D warnings > /tmp/clippy.json
          status=$?
          set -e
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error") | "\(.spans[0].file_name // "?"):\(.spans[0].line_start // 0): \(.message)"' /tmp/clippy.json 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do echo "::error::clippy: $line"; done
          exit $status

      - name: test
        run: cargo test --all-targets

      - name: web mock syntax
        run: node --check ../web/app.js

      - name: mock backend integration (incl. T5 innerHTML guard)
        run: node --test ../mock-server/server.test.js

      # §57: mỗi luật [CỨNG] của §41 phải xuất hiện trong log CI, không chỉ
      # trong file test. Đọc bằng mắt được ngay trên trang run.
      - name: security conformance summary
        run: |
          cargo test --test spec_conformance 2>&1 | grep -E "security_conformance::" | sed 's/^test security_conformance:://'

      # §57.9 + §58.12: log job này **không tải được** trong sandbox, nên khi
      # test app đỏ thì đẩy tên test + thông báo lỗi ra *annotation*. Đã có lần
      # CI đỏ ở đây mà chỉ đọc được "exit code 101" — vô dụng.
      - name: standalone exe tests
        run: |
          set +e
          cargo test --manifest-path ../app/Cargo.toml > /tmp/app-test.log 2>&1
          status=$?
          set -e
          cat /tmp/app-test.log
          if [ $status -ne 0 ]; then
            grep -E "^test .* FAILED|^---- .* stdout ----|panicked at|assertion|^failures:" /tmp/app-test.log | head -30 | while IFS= read -r line; do echo "::error::app test: $line"; done
          fi
          exit $status

      - name: standalone exe clippy
        run: cargo clippy --manifest-path ../app/Cargo.toml --all-targets -- -D warnings

      - name: standalone exe smoke check
        run: cargo run --manifest-path ../app/Cargo.toml -- --check

      - name: print pipelines (reviewable in the log)
        run: cargo run --quiet -- --demo

  # The artefact you actually download and run on the laptop.
  build-windows:
    name: build rd.exe (windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike

      - name: build
        run: cargo build --release

      - name: smoke-run
        run: .\target\release\rd.exe --demo

      - name: build Lantern mock app
        run: cargo build --manifest-path ..\app\Cargo.toml --release

      - name: smoke-check Lantern mock app
        run: ..\app\target\release\lantern-mock.exe --check

      - uses: actions/upload-artifact@v4
        with:
          name: rd-windows-x64
          path: spike/target/release/rd.exe
          if-no-files-found: error

      # §58.13: GStreamer vào thẳng artifact, người dùng không phải cài gì.
      #
      # Sự thật đã kiểm, sau một lần CI đỏ vì đoán sai:
      #   - GStreamer **không phát hành file zip** cho Windows (bản 1.24.10 tôi
      #     từng hard-code không tồn tại; dòng 1.24 chỉ có 1.24.13).
      #   - Bản MSVC 64-bit là **installer Inno Setup** 517 MB — cùng một file
      #     chứa mọi plugin. Không có "bản Complete" để chọn: "Complete" là một
      #     trang trong wizard, không phải gói khác.
      # ⇒ Cài im lặng rồi **thu gọn** bằng scripts/trim-gstreamer.ps1, script này
      # hỏi `gst-inspect` từng file plugin chứ không đoán tên file.
      - name: install GStreamer (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '1.28.8'
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'gstreamer.exe'
          Write-Host "Tải $url"
          # 517 MB: một lần đứt là hỏng cả job (đã xảy ra). Thử 3 lần, mỗi lần
          # kiểm kích thước tối thiểu để phân biệt "tải xong" với "tải một nửa".
          $attempt = 0
          $ok = $false
          while ($attempt -lt 3 -and -not $ok) {
            $attempt++
            try {
              if (Test-Path $exe) { Remove-Item $exe -Force }
              Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing -TimeoutSec 900
              $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
              if ($mb -lt 400) { throw "chỉ tải được $mb MB (mong > 400)" }
              $ok = $true
              Write-Host "Đã tải $mb MB (lần $attempt)"
            } catch {
              Write-Output "::warning::GStreamer download lần ${attempt}: $($_.Exception.Message)"
              if ($attempt -ge 3) {
                Write-Output "::error::GStreamer download thất bại sau 3 lần: $($_.Exception.Message)"
                exit 1
              }
              Start-Sleep -Seconds 10
            }
          }
          $target = Join-Path $env:RUNNER_TEMP 'gstreamer'
          # Inno Setup: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART. `/CURRENTUSER` để
          # không cần quyền admin trên runner, `/DIR` để không đụng chỗ cài chuẩn.
          $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            "/DIR=$target"
          )
          if ($proc.ExitCode -ne 0) {
            Write-Output "::error::GStreamer installer exit $($proc.ExitCode)"
            exit 1
          }
          if (-not (Test-Path (Join-Path $target 'bin/gst-launch-1.0.exe'))) {
            Write-Output "::error::Cài xong nhưng không thấy bin/gst-launch-1.0.exe trong $target"
            exit 1
          }
          Write-Host "== cài xong vào $target"

      # §58.13: log job và artifact đều KHÔNG đọc được từ sandbox (§56.10), nên
      # chẩn đoán đi qua **git** — kênh duy nhất đã chứng minh là đọc được.
      # CI đẩy file lên nhánh `ci-diag`, không đụng nhánh làm việc.
      - name: publish diagnostics to ci-diag branch
        shell: pwsh
        continue-on-error: true
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'gstreamer'
          $lines = @()
          $lines += "RUNNER_TEMP=$env:RUNNER_TEMP"
          $lines += "exists=$([bool](Test-Path $t))"
          if (Test-Path $t) {
            $lines += "--- top level:"
            $lines += (Get-ChildItem $t | Select-Object -ExpandProperty Name)
            $binDir = Join-Path $t 'bin'
            $lines += "--- bin exists=$([bool](Test-Path $binDir))"
            if (Test-Path $binDir) {
              $lines += (Get-ChildItem $binDir -Filter '*.exe' | Select-Object -ExpandProperty Name)
            }
            $plug = Join-Path $t 'lib/gstreamer-1.0'
            $lines += "--- plugins dir exists=$([bool](Test-Path $plug))"
            if (Test-Path $plug) {
              $dlls = Get-ChildItem $plug -Filter '*.dll'
              $lines += "plugin dll count=$($dlls.Count)"
              $env:GST_PLUGIN_SYSTEM_PATH_1_0 = $plug
              $env:GST_PLUGIN_PATH_1_0 = ''
              $insp = Join-Path $binDir 'gst-inspect-1.0.exe'
              if (Test-Path $insp) {
                $lines += "--- gst-inspect d3d11screencapturesrc:"
                $lines += (& $insp d3d11screencapturesrc 2>&1 | Select-Object -First 10)
                $jpeg = $dlls | Where-Object { $_.Name -match 'jpeg' } | Select-Object -First 1
                if ($jpeg) {
                  $lines += "--- inspect file $($jpeg.Name):"
                  $lines += (& $insp $jpeg.FullName 2>&1 | Select-Object -First 8)
                }
              }
            }
          }
          $lines | Out-File -FilePath diag.txt -Encoding utf8
          Write-Host ($lines -join "`n")
          git config user.name 'ci-diag'
          git config user.email 'ci-diag@users.noreply.github.com'
          git checkout -B ci-diag
          git add -f diag.txt
          git commit -m "ci-diag: run $env:GITHUB_RUN_ID" --quiet || Write-Host "không có gì thay đổi"
          git push --force origin ci-diag

      - name: trim GStreamer to the 6 elements this app uses
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'gstreamer'
          $out = Join-Path $PWD 'app/target/release/gst'
          # Không đọc được log job từ sandbox và annotation chỉ giữ 1 dòng, nên
          # chẩn đoán được ghi ra **file**, rồi upload làm artifact — thứ duy
          # nhất chắc chắn đọc được bằng API.
          $diag = Join-Path $env:RUNNER_TEMP 'trim-diag.txt'
          pwsh -File scripts/trim-gstreamer.ps1 -Root $target -Out $out *>&1 | Tee-Object -FilePath $diag
          $code = $LASTEXITCODE
          Copy-Item $diag (Join-Path $env:GITHUB_WORKSPACE 'trim-diag.txt') -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            Write-Output "::error::Thu gọn GStreamer thất bại — xem artifact trim-diag"
            exit 1
          }

      - name: upload trim diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-diag
          path: ${{ github.workspace }}/trim-diag.txt
          if-no-files-found: warn

      - name: smoke-run the trimmed bundle
        shell: pwsh
        run: |
          # Chạy `gst-launch-1.0` **chỉ với** bộ đã thu gọn, trên pipeline thật
          # nhưng thay capture bằng videotestsrc — runner không có desktop để
          # capture, nhưng mọi plugin còn lại (videoconvert, jpegenc,
          # multipartmux, fdsink) đều được chạm tới.
          $gst = 'app/target/release/gst'
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = Join-Path $PWD "$gst/lib/gstreamer-1.0"
          $env:GST_PLUGIN_PATH_1_0 = ''
          $out = Join-Path $env:RUNNER_TEMP 'frame.mjpg'
          & "$PWD/$gst/bin/gst-launch-1.0.exe" -q videotestsrc num-buffers=3 '!' video/x-raw,framerate=15/1 '!' videoconvert '!' jpegenc quality=70 '!' multipartmux boundary=lanternframe '!' filesink location=$out
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Bộ thu gọn không chạy được pipeline MJPEG"; exit 1 }
          $bytes = (Get-Item $out).Length
          if ($bytes -lt 200) { Write-Output "::error::Pipeline chạy nhưng chỉ ra $bytes byte"; exit 1 }
          Write-Host "== pipeline MJPEG chạy được với bộ thu gọn ($bytes byte, 3 frame)"

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-mock-windows-x64
          path: |
            app/target/release/lantern-mock.exe
            app/target/release/gst/
          if-no-files-found: error
