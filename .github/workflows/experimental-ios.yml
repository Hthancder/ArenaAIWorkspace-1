name: Experimental AIR iOS build

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
  workflow_dispatch:
    inputs:
      accept_air_license:
        description: 'I have read and accept the Adobe AIR SDK License Agreement'
        type: boolean
        required: true
        default: false
      release_existing:
        description: 'Publish a successful experimental IPA build as a prerelease'
        type: boolean
        required: true
        default: false
      artifact_run_id:
        description: 'Successful build run ID to publish'
        type: string
        required: false
        default: '44480837903'
      release_tag:
        description: 'New prerelease tag'
        type: string
        required: false
        default: 'lostlife-ios-test-1'

permissions:
  contents: read

jobs:
  experimental-ipa:
    # A push must not accept the AIR license on behalf of the user. Manual
    # dispatch can be used when this workflow also exists on the default branch.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.accept_air_license && !inputs.release_existing) || (github.event_name == 'push' && vars.AIR_SDK_LICENSE_ACCEPTED == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
      - name: Checkout game assets at investigated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4291b63d9b244eeb950b450e4b42de776327d4a1
          path: assets
      - name: Verify preparation tools
        working-directory: tooling
        run: python3 -m unittest discover -s tests -v
      - name: Set up AIR SDK
        uses: joshtynjala/setup-adobe-air-action@05ea6f91dae02a43f66f17a862ac95b34f4fc9dc
        with:
          air-version: '51.1.3.12'
          accept-license: 'true'
      - name: Reconstruct game files
        run: python3 tooling/tools/stage_air_game.py assets "$RUNNER_TEMP/air-staged"
      - name: Enable AIR diagnostics
        run: |
          mkdir -p "$HOME/.airsdk"
          printf 'DebugOut=true\n' > "$HOME/.airsdk/adt.cfg"
      - name: Attempt interpreter-mode IPA
        run: |
          export AIR_DEBUG_LOG="$HOME/adt.log"
          python3 tooling/tools/build_test_ipa.py "$RUNNER_TEMP/air-staged" "$RUNNER_TEMP/experimental.ipa"
      - name: Upload experimental IPA
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-ios-ipa
          path: ${{ runner.temp }}/experimental.ipa
          if-no-files-found: error
          retention-days: 3

  publish-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_existing }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download previously built IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          valid=$(gh run view "$BUILD_RUN" --json conclusion,headBranch,workflowName --jq '.conclusion == "success" and .headBranch == "arena/78062d86-arenaaiworkspace-1" and .workflowName == "Experimental AIR iOS build"')
          [[ "$valid" == true ]] || { echo 'Build run is not a successful build from this branch'; exit 1; }
          gh run download "$BUILD_RUN" --name experimental-ios-ipa --dir "$RUNNER_TEMP/release"
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^lostlife-ios-[a-z0-9-]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/experimental.ipa#LostLife-iOS-test.ipa" \
            --target "$GITHUB_SHA" --prerelease \
            --title "LostLife iOS — $RELEASE_TAG" \
            --notes "Bản AIR interpreter thử nghiệm cho TrollStore. Có thể gặp lỗi hoặc không tương thích; không dành cho App Store. Tài nguyên từ commit 4291b63; IPA từ build run $BUILD_RUN."
