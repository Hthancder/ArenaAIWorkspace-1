name: Dead Town native table research (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-native-re.yml
      - tools/deadtown_test3_graphics_evidence.py
      - tests/test_deadtown_test3_graphics_evidence.py
      - tools/deadtown_ios_compare.py
      - tests/test_deadtown_ios_compare.py
      - tools/deadtown_native_tables.py
      - tools/deadtown_native_callgraph.py
      - tools/deadtown_room_check_evidence.py
      - tools/deadtown_room_check_vm_probe.py
      - deadtown-source/project/scripts/check_room_is_multiplay_room.gml
      - tests/test_deadtown_room_check_evidence.py
      - tools/deadtown_gamepad_evidence.py
      - tools/deadtown_gamepad_vm_probe.py
      - tests/test_deadtown_gamepad_evidence.py
      - deadtown-source/project/scripts/gp_button_check.gml
      - deadtown-source/project/scripts/gp_button_check_pressed.gml
      - deadtown-source/project/scripts/gp_button_check_released.gml
      - deadtown-source/project/scripts/gp_axis_value.gml
      - tools/deadtown_item_lifetime_evidence.py
      - tools/deadtown_item_lifetime_vm_probe.py
      - tools/deadtown_zombie_item_vm_probe.py
      - tests/test_deadtown_item_lifetime_evidence.py
      - deadtown-source/project/objects/obj_item.object.gmx
      - deadtown-source/project/objects/obj_parcel.object.gmx
      - deadtown-source/project/objects/obj_zombie3.object.gmx
      - tools/deadtown_deactivate_auto_evidence.py
      - tests/test_deadtown_deactivate_auto_evidence.py
      - tools/deadtown_random_string_evidence.py
      - tools/deadtown_random_string_vm_probe.py
      - tests/test_deadtown_random_string_evidence.py
      - deadtown-source/project/scripts/generate_random_string.gml
      - tools/deadtown_basic_string_evidence.py
      - tests/test_deadtown_basic_string_evidence.py
      - deadtown-source/project/scripts/generate_basic_string.gml
      - tools/deadtown_gps_colour_evidence.py
      - tests/test_deadtown_gps_colour_evidence.py
      - deadtown-source/project/scripts/gps_colour_random.gml
      - tools/deadtown_item_kind_evidence.py
      - tools/deadtown_item_kind_vm_probe.py
      - tests/test_deadtown_item_kind_evidence.py
      - deadtown-source/project/scripts/item_check_pet.gml
      - deadtown-source/project/scripts/item_check_skin.gml
      - deadtown-source/project/deadtown.project.gmx
      - tools/deadtown_draw_call_evidence.py
      - tests/test_deadtown_draw_call_evidence.py
      - tools/deadtown_native_inventory.py
      - tools/deadtown_poison_evidence.py
      - tools/deadtown_item_drop_evidence.py
      - tests/test_deadtown_item_drop_evidence.py
      - tools/deadtown_weapon_save_evidence.py
      - tests/test_deadtown_weapon_save_evidence.py
      - tools/deadtown_item_get_evidence.py
      - tests/test_deadtown_item_get_evidence.py
      - tools/deadtown_item_equip_evidence.py
      - tests/test_deadtown_item_equip_evidence.py
      - tools/deadtown_inventory_save_evidence.py
      - tests/test_deadtown_inventory_save_evidence.py
      - tools/deadtown_sprite_metadata.py
      - tools/deadtown_sprite_pixels.py
      - tools/deadtown_sprite_masks.py
      - tests/test_deadtown_sprite_masks.py
      - tools/recover_deadtown_sprites.py
      - tests/test_recover_deadtown_sprites.py
      - tests/test_deadtown_sprite_metadata.py
      - tests/test_deadtown_sprite_pixels.py
      - tools/deadtown_native_lang.py
      - tools/deadtown_lang_fallback_evidence.py
      - tools/deadtown_lang_coverage.py
      - tests/test_deadtown_lang_coverage.py
      - tests/test_deadtown_lang_fallback_evidence.py
      - tools/recover_deadtown_audio.py
      - tests/test_deadtown_native_tables.py
      - tests/test_deadtown_native_callgraph.py
      - tests/test_deadtown_poison_evidence.py
      - tests/test_deadtown_native_lang.py

permissions:
  contents: read

jobs:
  static-re:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis dependencies
        run: python -m pip install capstone==5.0.6 pyelftools==0.32 Pillow==11.3.0
      - name: Retrieve and verify pinned original APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/deadtown
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > .cache/deadtown-original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  .cache/deadtown-original.apk' | sha256sum -c
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C .cache/deadtown --strip-components=1
          mkdir -p .cache/ios-original
          git fetch --no-tags origin d111b8605447c0aa65832b574c77645101340b73
          git show 'd111b8605447c0aa65832b574c77645101340b73:Dead Town-1.4.2.zip.001' > .cache/ios-original/part1
          git show 'd111b8605447c0aa65832b574c77645101340b73:Dead Town-1.4.2.zip.002' > .cache/ios-original/part2
          cat .cache/ios-original/part1 .cache/ios-original/part2 > .cache/ios-original/combined.zip
          unzip -p .cache/ios-original/combined.zip 'Dead Town-1.4.2.ipa' > '.cache/ios-original/Dead Town-1.4.2.ipa'
          cp .cache/deadtown-original.apk .cache/ios-original/android-original.apk
          echo '0212db7196f54894476d902bf8832e2e1db9f6de2121757c2740ec46283b0c09  .cache/ios-original/Dead Town-1.4.2.ipa' | sha256sum -c
      - name: Retrieve the existing test3 IPA for a static graphics comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deadtown-ios15-re-test-3 -R "$GITHUB_REPOSITORY" -p 'DeadTown-iOS15-RE-test3.ipa'
          echo '7e0f10c8761fe1160baa855a4e825aa31974f02cb2b2205a27b0df9d5aefe781  DeadTown-iOS15-RE-test3.ipa' | sha256sum -c
      - name: Run regression tests and generate research reports
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_deadtown_test3_graphics_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_ios_compare.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_native_tables.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_native_callgraph.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_room_check_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_kind_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_gps_colour_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_basic_string_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_random_string_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_deactivate_auto_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_lifetime_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_gamepad_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_draw_call_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_poison_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_drop_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_weapon_save_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_get_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_equip_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_inventory_save_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_sprite_metadata.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_sprite_pixels.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_sprite_masks.py' -v
          python -m unittest discover -s tests -p 'test_recover_deadtown_sprites.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_native_lang.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_lang_fallback_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_lang_coverage.py' -v
          mkdir -p work/reports
          python tools/deadtown_test3_graphics_evidence.py DeadTown-iOS15-RE-test3.ipa .cache/deadtown-original.apk --output work/reports/test3-graphics.json
          python tools/deadtown_ios_compare.py '.cache/ios-original/Dead Town-1.4.2.ipa' .cache/deadtown-original.apk --output work/reports/ios-android-assets.json
          python tools/deadtown_poison_evidence.py .cache/deadtown-original.apk --output work/reports/poison-evidence.json
          python tools/deadtown_item_drop_evidence.py .cache/deadtown-original.apk --output work/reports/item-drop-evidence.json
          python tools/deadtown_weapon_save_evidence.py .cache/deadtown-original.apk --output work/reports/weapon-save-evidence.json
          python tools/deadtown_item_get_evidence.py .cache/deadtown-original.apk --output work/reports/item-get-evidence.json
          python tools/deadtown_item_equip_evidence.py .cache/deadtown-original.apk --output work/reports/item-equip-evidence.json
          python tools/deadtown_inventory_save_evidence.py .cache/deadtown-original.apk --output work/reports/inventory-save-evidence.json
          python tools/deadtown_sprite_metadata.py .cache/deadtown-original.apk .cache/deadtown/deadtown.gmx --output work/reports/sprite-metadata.json
          python tools/deadtown_sprite_pixels.py .cache/deadtown-original.apk .cache/deadtown/deadtown.gmx --output work/reports/sprite-pixels.json
          python tools/deadtown_sprite_masks.py .cache/deadtown-original.apk --output work/reports/sprite-masks.json
          python tools/deadtown_native_callgraph.py .cache/deadtown-original.apk --output work/reports/native-callgraph.json
          python tools/deadtown_room_check_evidence.py .cache/deadtown-original.apk --project deadtown-source/project --output work/reports/room-check-evidence.json
          python tools/deadtown_item_kind_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/item-kind-evidence.json
          python tools/deadtown_gps_colour_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/gps-colour-evidence.json
          python tools/deadtown_basic_string_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/basic-string-evidence.json
          python tools/deadtown_random_string_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/random-string-evidence.json
          python tools/deadtown_deactivate_auto_evidence.py .cache/deadtown-original.apk --output work/reports/deactivate-auto-evidence.json
          python tools/deadtown_item_lifetime_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/item-lifetime-evidence.json
          python tools/deadtown_gamepad_evidence.py .cache/deadtown-original.apk deadtown-source/project --output work/reports/gamepad-evidence.json
          python tools/deadtown_draw_call_evidence.py .cache/deadtown-original.apk .cache/deadtown/deadtown.gmx --output work/reports/draw-calls.json
          python tools/deadtown_native_tables.py .cache/deadtown-original.apk --output work/reports/native-tables.json
          python tools/deadtown_native_lang.py .cache/deadtown-original.apk --compare-gmx .cache/deadtown/deadtown.gmx --output work/reports/native-language.json
          python tools/deadtown_lang_fallback_evidence.py .cache/deadtown-original.apk --output work/reports/language-fallback.json
          python tools/deadtown_lang_coverage.py .cache/deadtown-original.apk .cache/deadtown/deadtown.gmx --output work/reports/language-coverage.json
      - name: Preserve research reports (not a game build)
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-native-table-research
          path: work/reports/
          if-no-files-found: error
          retention-days: 3
