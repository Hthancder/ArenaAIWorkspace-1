name: Dead Town native table research (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-native-re.yml
      - tools/deadtown_native_tables.py
      - tools/deadtown_native_callgraph.py
      - tools/deadtown_native_inventory.py
      - tools/deadtown_poison_evidence.py
      - tools/deadtown_native_lang.py
      - tools/recover_deadtown_audio.py
      - tests/test_deadtown_native_tables.py
      - tests/test_deadtown_native_callgraph.py
      - tests/test_deadtown_poison_evidence.py
      - tests/test_deadtown_native_lang.py

permissions:
  contents: read

jobs:
  static-re:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned analysis dependencies
        run: python -m pip install capstone==5.0.6 pyelftools==0.32
      - name: Retrieve and verify pinned original APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/deadtown
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > .cache/deadtown-original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  .cache/deadtown-original.apk' | sha256sum -c
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C .cache/deadtown --strip-components=1
      - name: Run regression tests and generate research reports
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_deadtown_native_tables.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_native_callgraph.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_poison_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_native_lang.py' -v
          mkdir -p work/reports
          python tools/deadtown_poison_evidence.py .cache/deadtown-original.apk --output work/reports/poison-evidence.json
          python tools/deadtown_native_callgraph.py .cache/deadtown-original.apk --output work/reports/native-callgraph.json
          python tools/deadtown_native_tables.py .cache/deadtown-original.apk --output work/reports/native-tables.json
          python tools/deadtown_native_lang.py .cache/deadtown-original.apk --compare-gmx .cache/deadtown/deadtown.gmx --output work/reports/native-language.json
      - name: Preserve research reports (not a game build)
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-native-table-research
          path: work/reports/
          if-no-files-found: error
          retention-days: 3
