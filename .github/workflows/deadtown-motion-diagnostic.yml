name: Dead Town desktop motion diagnostic (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - .github/workflows/deadtown-motion-diagnostic.yml
      - tools/deadtown-motion-diagnostic.csx
      - tools/check_deadtown_motion_probe.py
      - tests/test_check_deadtown_motion_probe.py

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image checks and graphics dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libbz2-dev libgl1-mesa-dri xvfb
          python -m unittest discover -s tests -p 'test_check_deadtown_motion_probe.py' -v
      - name: Retrieve original RE-test3 package and source event descriptions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/game work/source
          gh release download deadtown-ios15-re-test-3 -R "$GITHUB_REPOSITORY" -p 'DeadTown-iOS15-RE-test3.ipa' -O work/test3.ipa
          echo '7e0f10c8761fe1160baa855a4e825aa31974f02cb2b2205a27b0df9d5aefe781  work/test3.ipa' | sha256sum -c
          unzip -p work/test3.ipa Payload/gmRunner.app/BundledGame/data.win > work/game/data.win
          echo '313da9db0f0f74b1e9eea100b8f0de0e7d315e3f21697d638a44a9e2014608b0  work/game/data.win' | sha256sum -c
          for n in 1 2; do unzip -p work/test3.ipa "Payload/gmRunner.app/BundledGame/audiogroup$n.dat" > "work/game/audiogroup$n.dat"; done
          curl -fsSL --retry 2 'https://codeload.github.com/kjs104901/deadtown/tar.gz/5e3d798f914c8cd3b066c8289323005d63111f37' | tar xz -C work/source --strip-components=1
          python tools/stage_deadtown_gmx.py work/source/deadtown.gmx work/staged || test "$?" -eq 1
          python tools/prepare_deadtown_offline.py work/staged work/offline
          python tools/deadtown_event_probe.py work/offline work/events.json
      - name: Instrument a disposable copy only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events.json
        run: |
          set -euo pipefail
          mkdir -p work/utmt work/diagnostic
          gh release download 0.9.2.0 -R UnderminersTeam/UndertaleModTool -p 'UTMT_CLI_v0.9.2.0-Ubuntu.zip' -O work/utmt.zip
          echo 'd182f00c0e5ced8d9252aa1f796374cfee077a3889a658e70b68685f9cd559c7  work/utmt.zip' | sha256sum -c
          unzip -q work/utmt.zip -d work/utmt
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          chmod +x "$exe"
          "$exe" load work/game/data.win -s tools/deadtown-motion-diagnostic.csx -o work/diagnostic/data.win > work/instrument.log 2>&1 || { tail -80 work/instrument.log; exit 1; }
          grep -F 'MOTION_INSTRUMENT: disposable desktop only' work/instrument.log
          cp work/game/audiogroup*.dat work/diagnostic/
      - uses: actions/cache/restore@v4
        id: runner-cache
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Build runner if cache unavailable
        shell: bash
        run: |
          set -euo pipefail
          if test '${{ steps.runner-cache.outputs.cache-hit }}' != 'true' || ! test -x work/runner-build/gmrunner; then
            mkdir -p work/runner
            curl -fsSL --retry 2 'https://codeload.github.com/andronep/gmrunner/tar.gz/e7121381d38b03a24242812fc22b0a7386d545c6' | tar xz -C work/runner --strip-components=1
            cmake -S work/runner -B work/runner-build -DCMAKE_BUILD_TYPE=Release
            cmake --build work/runner-build --target gmrunner --parallel 4
          fi
      - name: Render stationary and scripted movement with desktop GLES
        shell: bash
        run: |
          set -euo pipefail
          for mode in still moving; do
            mkdir -p "work/shots-$mode" "work/save-$mode"
            input=()
            if [ "$mode" = moving ]; then input=(--input '170:D:down,200:D:up'); fi
            timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' work/runner-build/gmrunner work/diagnostic \
              --hidden --gles --fast --mute --seed 1 --frames 230 --trace --goto rom_play@160 \
              --screenshot 175,190,210 --screenshot-dir "work/shots-$mode" --save-dir "work/save-$mode" \
              "${input[@]}" > "work/$mode.log" 2>&1 || { tail -80 "work/$mode.log"; exit 1; }
            grep -F '[room] -> rom_play' "work/$mode.log"
            grep -F 'DT_MOTION|' "work/$mode.log" >/dev/null
          done
          python tools/check_deadtown_motion_probe.py work/still.log work/moving.log work/shots-still work/shots-moving --output work/result.json | tee work/check.log
      - name: Summarize motion diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('instrument.log', 'still.log', 'moving.log', 'check.log'):
              p = Path('work') / name
              if not p.exists():
                  print('::warning::' + name + ' missing')
                  continue
              lines = p.read_text(errors='replace').splitlines()
              chosen = [s for s in lines if any(x in s for x in ('MOTION_INSTRUMENT', 'MOTION_PROBE', 'DT_MOTION|', 'error', 'Error', 'Traceback'))]
              for part, rows in (('head', chosen[:5]), ('tail', chosen[-8:])):
                  print('::notice::' + name + ' ' + part + ': ' + ' | '.join(rows).replace('%', '%25')[:3500])
          PY
      - name: Preserve research results, not game data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-desktop-motion-report
          path: |
            work/instrument.log
            work/still.log
            work/moving.log
            work/check.log
            work/result.json
          if-no-files-found: ignore
          retention-days: 3
