name: Dead Town editable source VM diagnostic (no IPA)

on:
  push:
    branches:
      - arena/78062d86-arenaaiworkspace-1
    paths:
      - '.github/workflows/deadtown-source-vm-diagnostic.yml'
      - 'deadtown-source/project/**'
      - 'tools/deadtown-vm-probe.csx'
      - 'tools/deadtown_event_probe.py'
      - 'tools/deadtown_item_kind_vm_probe.py'
      - 'tools/deadtown_random_string_vm_probe.py'
      - 'tools/deadtown_room_check_vm_probe.py'
      - 'tools/deadtown_item_lifetime_vm_probe.py'
      - 'tools/deadtown_item_motion_evidence.py'
      - 'tools/deadtown_item_motion_vm_probe.py'
      - 'tests/test_deadtown_item_motion_evidence.py'
      - 'tools/deadtown_item_schedule_vm_probe.py'
      - 'tests/test_deadtown_item_schedule_vm_probe.py'
      - 'tools/deadtown_zombie_item_vm_probe.py'
      - 'tools/deadtown_gamepad_evidence.py'
      - 'tools/deadtown_gamepad_vm_probe.py'
      - 'tools/deadtown_settings_particle_evidence.py'
      - 'tools/deadtown_boss2_turn_evidence.py'
      - 'tools/deadtown_inventory_keys_evidence.py'
      - 'tools/deadtown_inventory_keys_vm_probe.py'
      - 'tests/test_deadtown_inventory_keys_evidence.py'
      - 'tools/deadtown_boss2_distance_evidence.py'
      - 'tools/deadtown_boss2_distance_vm_probe.py'
      - 'tests/test_deadtown_boss2_distance_evidence.py'
      - 'tools/deadtown_boss2_schedule_vm_probe.py'
      - 'tools/deadtown_light_cleanup_evidence.py'
      - 'tools/deadtown_light_cleanup_vm_probe.py'
      - 'tests/test_deadtown_light_cleanup_evidence.py'
      - 'tests/test_deadtown_boss2_turn_evidence.py'
      - 'tests/test_deadtown_boss2_schedule_vm_probe.py'
      - 'tools/deadtown_crosshair_evidence.py'
      - 'tests/test_deadtown_crosshair_evidence.py'
      - 'tools/deadtown_settings_particle_vm_probe.py'
      - 'tests/test_deadtown_settings_particle_evidence.py'
      - 'tests/test_deadtown_gamepad_evidence.py'
      - 'tests/test_deadtown_item_lifetime_evidence.py'
      - 'tests/test_deadtown_room_check_evidence.py'
      - 'tools/deadtown_random_string_reference.cpp'
      - 'tests/test_deadtown_random_string_evidence.py'
      - 'tools/deadtown_item_kind_evidence.py'
      - 'tests/test_deadtown_item_kind_evidence.py'
      - 'tools/check_deadtown_source_vm.py'
      - 'tests/test_check_deadtown_source_vm.py'
      - 'tools/deadtown_ios_compare.py'
      - 'tools/deadtown_native_inventory.py'
      - 'tools/deadtown_sprite_metadata.py'
      - 'tools/recover_deadtown_audio.py'

permissions:
  contents: read

jobs:
  source-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s tests -p 'test_check_deadtown_source_vm.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_schedule_vm_probe.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_item_motion_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_boss2_schedule_vm_probe.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_boss2_distance_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_inventory_keys_evidence.py' -v
          python -m unittest discover -s tests -p 'test_deadtown_light_cleanup_evidence.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libbz2-dev pkg-config
      - name: Retrieve pinned APK and generate events from editable source
        run: |
          set -euo pipefail
          mkdir -p work/utmt work/game work/save-boot work/save-play
          git fetch --no-tags origin 8643abdda26944002384bc216bf555717a9e1e42
          git show '8643abdda26944002384bc216bf555717a9e1e42:Dead+Town+-+Zombie+survival_1.4.2_APKPure.apk' > work/original.apk
          echo 'bc8fa1990cb2cdde8d184f2a942fe4010820f0592d88a36e1cbee0a6aac081fb  work/original.apk' | sha256sum -c
          unzip -p work/original.apk assets/game.droid > work/game.droid
          echo "$(python -c 'from tools.check_deadtown_source_vm import GAME_DATA_SHA256; print(GAME_DATA_SHA256)')  work/game.droid" | sha256sum -c
          python tools/deadtown_event_probe.py deadtown-source/project work/events-original.json
          python tools/deadtown_item_kind_vm_probe.py instrument work/events-original.json work/events.json
          for n in 1 2; do unzip -p work/original.apk "assets/audiogroup$n.dat" > "work/game/audiogroup$n.dat"; done
      - name: Compile editable scripts and events into disposable data
        env:
          GH_TOKEN: ${{ github.token }}
          GML_PROBE_SOURCE: ${{ github.workspace }}/deadtown-source/project/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events.json
        run: |
          set -euo pipefail
          gh release download 0.9.2.0 -R UnderminersTeam/UndertaleModTool -p 'UTMT_CLI_v0.9.2.0-Ubuntu.zip' -O work/utmt.zip
          echo 'd182f00c0e5ced8d9252aa1f796374cfee077a3889a658e70b68685f9cd559c7  work/utmt.zip' | sha256sum -c
          unzip -q work/utmt.zip -d work/utmt
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          chmod +x "$exe"
          "$exe" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/game/data.win > work/compile.log 2>&1 || { tail -120 work/compile.log; exit 1; }
          grep -F 'PROBE: incomplete data' work/compile.log
      - name: Compile a separate disposable seeded random-string probe
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/deadtown-source/project/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events-random.json
        run: |
          set -euo pipefail
          python tools/deadtown_room_check_vm_probe.py instrument work/events-original.json work/events-room.json
          python tools/deadtown_item_lifetime_vm_probe.py instrument work/events-room.json work/events-item-lifetime.json
          python tools/deadtown_zombie_item_vm_probe.py instrument deadtown-source/project work/events-item-lifetime.json work/events-zombie-item.json
          python tools/deadtown_random_string_vm_probe.py instrument work/events-zombie-item.json work/events-random.json
          mkdir -p work/random-game work/save-random
          cp work/game/audiogroup*.dat work/random-game/
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          "$exe" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/random-game/data.win > work/random-compile.log 2>&1 || { tail -120 work/random-compile.log; exit 1; }
          grep -F 'PROBE: incomplete data' work/random-compile.log
      - name: Compile separate item alarm scheduling diagnostic
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/deadtown-source/project/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events-item-boss-motion.json
        run: |
          set -euo pipefail
          python tools/deadtown_item_schedule_vm_probe.py instrument work/events-original.json work/events-item-schedule.json
          python tools/deadtown_boss2_schedule_vm_probe.py instrument deadtown-source/project work/events-item-schedule.json work/events-item-boss-schedule.json
          python tools/deadtown_light_cleanup_vm_probe.py instrument deadtown-source/project work/events-item-boss-schedule.json work/events-item-boss-light.json
          python tools/deadtown_boss2_distance_vm_probe.py instrument deadtown-source/project work/events-item-boss-light.json work/events-item-boss-distance.json
          python tools/deadtown_inventory_keys_vm_probe.py instrument deadtown-source/project work/events-item-boss-distance.json work/events-item-boss-inventory.json
          python tools/deadtown_item_motion_vm_probe.py instrument deadtown-source/project work/events-item-boss-inventory.json work/events-item-boss-motion.json
          mkdir -p work/item-schedule-game work/save-item-schedule
          cp work/game/audiogroup*.dat work/item-schedule-game/
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          "$exe" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/item-schedule-game/data.win > work/item-schedule-compile.log 2>&1 || { tail -120 work/item-schedule-compile.log; exit 1; }
          grep -F 'PROBE: incomplete data' work/item-schedule-compile.log
      - name: Compile a separate mocked-gamepad diagnostic
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/work/gamepad-project/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events-gamepad.json
        run: |
          set -euo pipefail
          python tools/deadtown_gamepad_vm_probe.py instrument deadtown-source/project work/gamepad-project work/events-original.json work/events-gamepad.json
          mkdir -p work/gamepad-game work/save-gamepad
          cp work/game/audiogroup*.dat work/gamepad-game/
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          "$exe" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/gamepad-game/data.win > work/gamepad-compile.log 2>&1 || { tail -120 work/gamepad-compile.log; exit 1; }
          grep -F 'PROBE: incomplete data' work/gamepad-compile.log
      - name: Compile a separate mocked settings and particle diagnostic
        env:
          GML_PROBE_SOURCE: ${{ github.workspace }}/work/settings-project/scripts/lang_type_set.gml
          GML_PROBE_EVENTS: ${{ github.workspace }}/work/events-settings.json
        run: |
          set -euo pipefail
          python tools/deadtown_settings_particle_vm_probe.py instrument deadtown-source/project work/settings-project work/events-original.json work/events-settings.json
          mkdir -p work/settings-game work/save-settings
          cp work/game/audiogroup*.dat work/settings-game/
          exe=$(find work/utmt -type f -name UndertaleModCli | head -1)
          test -n "$exe"
          "$exe" load work/game.droid -s tools/deadtown-vm-probe.csx -o work/settings-game/data.win > work/settings-compile.log 2>&1 || { tail -120 work/settings-compile.log; exit 1; }
          grep -F 'PROBE: incomplete data' work/settings-compile.log
      - name: Restore pinned desktop runner cache
        id: runner-cache
        uses: actions/cache/restore@v4
        with:
          path: work/runner-build
          key: gmrunner-linux-e7121381d38b03a24242812fc22b0a7386d545c6-v1
      - name: Build desktop runner if necessary
        run: |
          set -euo pipefail
          if [ '${{ steps.runner-cache.outputs.cache-hit }}' != 'true' ] || ! test -x work/runner-build/gmrunner; then
            mkdir -p work/runner
            curl -fsSL --retry 2 'https://codeload.github.com/andronep/gmrunner/tar.gz/e7121381d38b03a24242812fc22b0a7386d545c6' | tar xz -C work/runner --strip-components=1
            cmake -S work/runner -B work/runner-build -DCMAKE_BUILD_TYPE=Release > work/build.log 2>&1
            cmake --build work/runner-build --target gmrunner --parallel 4 >> work/build.log 2>&1 || { tail -100 work/build.log; exit 1; }
          fi
      - name: Exercise isolated headless boot and forced room
        run: |
          set -euo pipefail
          timeout 90 work/runner-build/gmrunner work/game --headless --fast --mute --seed 1 --frames 300 --trace --stats --save-dir work/save-boot > work/boot.log 2>&1 || { tail -100 work/boot.log; exit 1; }
          python tools/deadtown_item_kind_vm_probe.py check work/boot.log
          timeout 90 work/runner-build/gmrunner work/game --headless --fast --mute --seed 1 --frames 400 --trace --stats --goto rom_play@160 --save-dir work/save-play > work/play.log 2>&1 || { tail -100 work/play.log; exit 1; }
      - name: Exercise separate string, room and item-lifetime probes
        run: |
          set -euo pipefail
          if ! test -f work/runner/src/runtime/Random.h; then
            mkdir -p work/runner
            curl -fsSL --retry 2 'https://codeload.github.com/andronep/gmrunner/tar.gz/e7121381d38b03a24242812fc22b0a7386d545c6' | tar xz -C work/runner --strip-components=1
          fi
          g++ -std=c++17 -Iwork/runner/src tools/deadtown_random_string_reference.cpp -o work/random-reference
          work/random-reference > work/random-reference.log
          python tools/deadtown_random_string_vm_probe.py check work/random-reference.log
          timeout 90 work/runner-build/gmrunner work/random-game --headless --fast --mute --seed 1 --frames 180 --trace --stats --goto rom_play_defence@100 --save-dir work/save-random > work/random.log 2>&1 || { tail -100 work/random.log; exit 1; }
          python tools/deadtown_random_string_vm_probe.py check work/random.log
          python tools/deadtown_room_check_vm_probe.py check work/random.log
          python tools/deadtown_item_lifetime_vm_probe.py check work/random.log
          python tools/deadtown_zombie_item_vm_probe.py check work/random.log
      - name: Exercise isolated item alarm scheduling
        run: |
          set -euo pipefail
          timeout 90 work/runner-build/gmrunner work/item-schedule-game --headless --fast --mute --seed 1 --frames 930 --trace --stats --save-dir work/save-item-schedule > work/item-schedule.log 2>&1 || { tail -100 work/item-schedule.log; exit 1; }
          python tools/deadtown_item_schedule_vm_probe.py check work/item-schedule.log
          python tools/deadtown_boss2_schedule_vm_probe.py check work/item-schedule.log
          python tools/deadtown_light_cleanup_vm_probe.py check work/item-schedule.log
          python tools/deadtown_boss2_distance_vm_probe.py check work/item-schedule.log
          python tools/deadtown_inventory_keys_vm_probe.py check work/item-schedule.log
          python tools/deadtown_item_motion_vm_probe.py check work/item-schedule.log
      - name: Report isolated scheduling markers
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('work/item-schedule.log')
          if p.exists():
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'ITEM_SCHEDULE_VM:' in line]
              print('::notice::ITEM_SCHEDULE_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'BOSS2_SCHEDULE_VM:' in line]
              print('::notice::BOSS2_SCHEDULE_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'LIGHT_CLEANUP_VM:' in line]
              print('::notice::LIGHT_CLEANUP_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'BOSS2_DISTANCE_VM:' in line]
              print('::notice::BOSS2_DISTANCE_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'PARENT_BOSS_DISTANCE_VM:' in line]
              print('::notice::PARENT_BOSS_DISTANCE_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'BOSS_INHERIT_VM:' in line]
              print('::notice::BOSS_INHERIT_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'INVENTORY_KEYS_VM:' in line]
              print('::notice::INVENTORY_KEYS_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'ITEM_MOTION_VM:' in line]
              print('::notice::ITEM_MOTION_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
          else:
              print('::notice::ITEM_SCHEDULE_DIAGNOSTIC: no log')
          PY
      - name: Exercise mocked-gamepad candidates
        run: |
          set -euo pipefail
          timeout 90 work/runner-build/gmrunner work/gamepad-game --headless --fast --mute --seed 1 --frames 90 --trace --stats --save-dir work/save-gamepad > work/gamepad.log 2>&1 || { tail -100 work/gamepad.log; exit 1; }
          python tools/deadtown_gamepad_vm_probe.py check work/gamepad.log
      - name: Exercise mocked settings and particle candidates
        run: |
          set -euo pipefail
          timeout 90 work/runner-build/gmrunner work/settings-game --headless --fast --mute --seed 1 --frames 90 --trace --stats --save-dir work/save-settings > work/settings.log 2>&1 || { tail -100 work/settings.log; exit 1; }
          python tools/deadtown_settings_particle_vm_probe.py check work/settings.log
      - name: Report mocked settings and particle markers
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('work/settings.log')
          if p.exists():
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'SETTINGS_PARTICLE_VM:' in line]
              print('::notice::SETTINGS_PARTICLE_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
          else:
              print('::notice::SETTINGS_PARTICLE_DIAGNOSTIC: no log')
          PY
      - name: Report mocked gamepad markers
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('work/gamepad.log')
          if p.exists():
              lines = [line for line in p.read_text(errors='replace').splitlines() if 'GAMEPAD_VM:' in line]
              print('::notice::GAMEPAD_DIAGNOSTIC: ' + ' | '.join(lines).replace('%', '%25')[:3000])
          else:
              print('::notice::GAMEPAD_DIAGNOSTIC: no log')
          PY
      - name: Compare resource IDs and report observed warnings
        run: |
          set -euo pipefail
          python tools/check_deadtown_source_vm.py work/original.apk work/game/data.win deadtown-source/project work/events.json work/compile.log work/boot.log work/play.log --output work/report.json | tee work/check.log
          python - <<'PY'
          from pathlib import Path
          import json
          r = json.loads(Path('work/report.json').read_text())
          for key in ('compile', 'resources', 'boot', 'forced_play'):
              print('::notice::SOURCE_VM_' + key.upper() + ': ' + json.dumps(r[key], separators=(',', ':')).replace('%', '%25')[:3500])
          print('::notice::SOURCE_VM_LIMIT: disposable VM only, original APK sprite data, no IPA or iOS verification')
          PY
      - name: Preserve diagnostics only, not game data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadtown-source-vm-diagnostics
          path: |
            work/build.log
            work/compile.log
            work/random-compile.log
            work/gamepad-compile.log
            work/gamepad.log
            work/settings-compile.log
            work/settings.log
            work/item-schedule-compile.log
            work/item-schedule.log
            work/random.log
            work/random-reference.log
            work/boot.log
            work/play.log
            work/check.log
            work/report.json
          if-no-files-found: ignore
          retention-days: 3
