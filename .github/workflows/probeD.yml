name: probeD

on:
  push:
    branches: ['**']      # chạy trên mọi branch để test tweak
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # để tạo Release kèm .deb

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: .deb (${{ matrix.scheme }})
    # Không dùng macOS runner (tốn phí). Build bằng zig trên Ubuntu.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài phụ thuộc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git rsync dpkg fakeroot xz-utils curl ca-certificates python3
          python3 -m pip install "ziglang==0.13.0"

      - name: Kiểm tra toolchain
        run: |
          # wheel ziglang không cài binary vào PATH, chỉ có module + binary trong site-packages
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          chmod +x "$ZIG"
          "$ZIG" version
          echo "ZIG_BIN=$ZIG" >> "$GITHUB_ENV"

      - name: Lấy Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Lấy iOS SDK 15.6
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS15.6.sdk
          ln -sfn "$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" "$RUNNER_TEMP/theos/sdks/iPhoneOS15.6.sdk"
          ls -l "$RUNNER_TEMP/theos/sdks"

      - name: Build
        run: |
          chmod +x build.sh tools/*.sh tools/theos-toolchain-stub/bin/*
          ./build.sh --linux

      - name: Kiểm tra sản phẩm
        run: |
          set -e
          deb=$(ls packages/*.deb | head -1)
          echo "== $deb"
          dpkg-deb -I "$deb"
          echo "== nội dung"
          dpkg-deb -c "$deb"
          # Binaries phải là Mach-O arm64
          tmp=$(mktemp -d)
          dpkg-deb -x "$deb" "$tmp"
          for f in "$tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/"*.dylib; do
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            echo "$(basename "$f"): magic=$magic size=$(stat -c%s "$f")"
            [ "$magic" = "cffaedfe" ] || { echo "::error::Không phải Mach-O 64 little-endian"; exit 1; }
            [ "$(stat -c%s "$f")" -gt 20000 ] || { echo "::error::File rỗng/quá nhỏ"; exit 1; }
          done
          # Không được có arm64e (theo yêu cầu)
          if command -v lipo >/dev/null; then lipo -archs "$tmp"/var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib; fi

      - name: Checksum + tóm tắt
        run: |
          deb=$(ls packages/*.deb | head -1)
          sha256sum "$deb" | tee SHA256SUMS
          {
            echo "### SiriBridge .deb"
            echo '```'
            dpkg-deb -f "$deb"
            echo '```'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SiriBridge-deb-${{ github.sha }}
          path: |
            packages/*.deb
            SHA256SUMS
          if-no-files-found: error

      - name: Phát hành (tag v* hoặc chạy tay)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('ci-{0}', github.run_number) }}
          name: SiriBridge ${{ github.ref_name }}
          body: |
            Build tự động bởi GitHub Actions.
            * iOS 15 · rootless · iphoneos-arm64 (không arm64e)
            * cài: `dpkg -i *.deb` hoặc mở bằng Sileo/Zebra
          files: |
            packages/*.deb
            SHA256SUMS
          fail_on_unmatched_files: true

      - name: Upload log toàn bộ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            .theos/**/*.log
          if-no-files-found: ignore
