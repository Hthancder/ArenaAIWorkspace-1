[package]
name = "taskora"
version = "2.7.0"
description = "Taskora — ứng dụng quản lý công việc Windows (Tauri + Rust)"
authors = ["Hthancder"]
license = "MIT"
edition = "2021"

[[bin]]
name = "Taskora"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
window-vibrancy = "0.5"
tauri-plugin-dialog = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
